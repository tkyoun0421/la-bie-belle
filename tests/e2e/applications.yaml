# 근무 신청 모아보기 — 관리자가 근무 신청이 하나도 없는 달의 모아보기로
# 들어가서 날짜순·사람순을 오가고, 마감일 시트가 열리는 것까지 본다.
#
# 근거는 docs/2-design/spec/schedule-admin.md(AC-06)와
# docs/2-design/modules/schedule/screens/scheduleAdmin.md의 「근무 신청
# 모아보기」다. 배정받은 리스크는(schedule-admin-test-plan.md 「배정 → e2e」)
#   - 날짜순·사람순 탭이 같은 신청을 두 방향으로 든다(여기서는 0건이라 두
#     탭 다 같은 빈 상태를 보여주는 것으로 확인한다)
#   - 「마감일 바꾸기」가 마감일 시트를 연다
# 신청이 있을 때의 이름 묶기 재구성(날짜순↔사람순 실제 내용)은
# test-planner가 이미 unit으로 배정했다(applications-grouping.test.ts) —
# 여기서는 그 결과가 실제 라우트·훅·API로 이어지는지만 본다.
#
# 세션은 개발 빌드의 테스트 문과 시드 서버로 심는다 — 계약은
# tests/e2e/schedule-worker.yaml 머리말과 scripts/e2eSeedServer.mts를
# 따른다. 딥링크는 navigation.md 「경로」의 "/admin/applications"(`?month=`)
# 그대로다.
#
# **시드 서버에 상태 하나가 아직 없다 — implementer가 이 task에서 더한다.**
# tests/e2e/schedule-admin.yaml이 요청한 schedule_admin_empty_month·
# schedule_admin_confirmed와 같은 자리에 놓는 세 번째 상태다.
#
# ## schedule_admin_applications
#
# 관리자 하나를 만들고 `withFreshMonth`로 고른 달에 `create_schedule(admin,
# monthDate, kstDate(3))`을 부른다 — 마감일이 아직 남아 있어야 「마감 전」
# 문구와 "오늘 이전은 고를 수 없어요" 도움말이 그대로 선다. 근무 신청은 하나도
# 안 만든다 — 0건 빈 상태를 그대로 쓴다. 응답에 `month`(raw
# "YYYY-MM")·`monthLabel`(spellMonth)을 싣는다.
#
# 텍스트 셀렉터는 정규식이다. 마감일과 남은 날처럼 오늘 날짜에 따라 바뀌는
# 문구는 ".*"로 감싸 일부만 맞힌다.
appId: com.labiebelle.app
---
- launchApp:
    clearState: true
    clearKeychain: true

- runScript:
    file: scripts/seed-session.js
    env:
      STATE: schedule_admin_applications
- openLink: "labiebelle://__test/session?access_token=${output.accessToken}&refresh_token=${output.refreshToken}"
- openLink: "labiebelle://admin/applications?month=${output.month}"

# --- 진입: 마감 전 문구, 신청 0건이라 빈 상태 두 줄 ---
- assertVisible: ".*근무 신청"
- assertVisible: "마감.*남았어요"
- assertVisible: "날짜순"
- assertVisible: "사람순"
- assertVisible: "아직 들어온 신청이 없어요"
- assertVisible: "마감은.*이에요"

# --- 사람순으로 바꿔도 같은 빈 상태다 ---
- tapOn: "사람순"
- assertVisible: "아직 들어온 신청이 없어요"
- tapOn: "날짜순"

# --- 마감일 바꾸기 → 같은 마감일 시트 ---
- tapOn: "마감일 바꾸기"
- assertVisible: "스케줄 신청 마감일"
- assertVisible: "오늘 이전은 고를 수 없어요"
- assertVisible: "바꾸면 전원에게 알림이 가요"
- assertVisible: "바꾸기"
- tapOn: "닫기"
