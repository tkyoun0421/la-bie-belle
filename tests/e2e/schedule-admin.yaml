# 관리자 근무표 — 관리자가 빈 달에서 근무표를 만들고, 날을 열고(부분 실패를
# 포함해), 배정 없는 날을 닫고, 마감 전 확정 잠김을 확인하고, 마감이 지난 다른
# 달에서 실제로 확정하고, 이미 확정된 달에서 확정 뒤 달력(배지·확정
# 줄·사라진 줄들)과 확정 뒤에도 날 열기가 되는 것까지 한 여정으로 간다.
#
# 근거는 docs/2-design/spec/schedule-admin.md(AC-02·AC-04·AC-05·AC-07·AC-08,
# AC-06의 마감일 시트 재사용 조각)과
# docs/2-design/modules/schedule/screens/schedule-admin.md다. 배정받은
# 리스크는(schedule-admin-test-plan.md 「배정 → e2e」, 확정 조각은 총괄이
# 판정을 넓혀 직접 추가했다)
#   - 빈 상태 → 마감일 시트 → 달 만들기 → 만든 직후 안내 줄
#   - 날 열기 모드에서 여러 날을 골라 「n일 열기」 → 부분 실패(이미 연 날 하나
#     섞기) → 실패한 날짜를 토스트가 말한다 → 모드가 안 풀린다
#   - 날 상세 껍데기 — 근무 시간 줄·근무 신청 줄만 있고 임시공휴일·근무 조정은
#     없다(payroll-adjust 몫)
#   - 배정 없는 날은 확인 없이 바로 닫힌다
#   - 확정 잠김 문구와 「마감일 당기기」가 모아보기와 같은 마감일 시트를 연다
#   - 마감이 지나면 「확정하기」가 열리고, 시트가 빈 자리 목록(넷까지·「외
#     n개」)을 보여주고, 확정하면 같은 시트 안에서 결과로 바뀌고, 닫으면 배지·
#     확정 줄이 선다
#   - 확정된 달 — 배지·확정 줄이 서고 마감 줄·BottomCTA·범례·모아보기 줄이
#     사라진다. 확정 뒤에도 「날 열기」가 되고 새로 연 날에도 「이 날 닫기」가
#     없다
# 업무 규칙의 경우의 수(함수 분기 아홉 개·already_confirmed·set_hall_defaults
# 캐시 키 등)는 test-planner가 이미 unit·integration으로 배정했다
# (schedule-admin-test-plan.md 「배정 → unit」「배정 → integration」) — 여기서는
# 그 규칙이 실제로 화면·훅·API·DB를 잇는지만 본다.
#
# **확정 실패 경로(원이 흔들리고 「다시 확정하기」가 남는 것)는 뺐다.** 이
# 층에서 통신을 인위로 끊을 방법이 없다 — 시드 서버는 로컬 Supabase로만
# 가고 Maestro 플로우 안에서 그 사이를 끊는 도구가 없다(execution.md
# 「pnpm e2e」가 든 수단 안에 그런 손잡이가 없다). `already_confirmed`가
# 성공으로 처리되는 것(총괄이 정한 5번)도 같은 이유로 여기서 못 만든다 — 두
# 관리자가 동시에 확정하는 경합은 schedule_admin_race_open이 이미 쓴 것과
# 같은 종류의 손이 필요한데, `confirm_schedule`을 세션 밖에서 먼저 불러
# 같은 효과를 내는 자리는 이번 요청 범위 밖이다. 함수 분기 자체는
# schedule-functions.integration.test.ts가 이미 덮는다(계획 6번).
#
# 포지션 아홉 줄 안쪽(자리·배정·사람 픽커)은 schedule-assign 몫이라 이 task의
# 날 상세는 채움 수만 세는 임시 줄이다(spec 「범위 밖」). 그래서 이 파일 안에서는
# 배정을 하나도 만들지 않고, 「배정이 있는 날 닫기 경고 시트」와 「빈 자리가 있는
# 확정 시트의 경고 블록」은 이 task의 화면만으로는 밟을 수 없다 — 아래 결과의
# 「못 쓴 것」에 적는다.
#
# 세션은 개발 빌드의 테스트 문과 시드 서버로 심는다 — 계약은
# tests/e2e/schedule-worker.yaml 머리말, scripts/e2eSeedServer.mts,
# scripts/seed-session.js를 따른다. 딥링크는 navigation.md 「경로」의
# "/admin/schedule"(`?month=`·`?date=` 그대로) 행이다.
#
# **시드 서버에 상태 넷과 액션 하나가 아직 없다 — implementer가 이 task에서
# 더한다.** 전부 tests/integration/postgres.ts의 헬퍼(withFreshMonth·kstDate·
# backdateDeadline·createAdminUser)를 그대로 쓴다 — schedule-worker.yaml의
# 두 상태가 세운 손을 그대로 잇는다.
#
# ## schedule_admin_empty_month
#
# 관리자 하나를 만들고(createAdminUser) `withFreshMonth`로 고른 달에는 아무것도
# 만들지 않는다 — 그 달에 `schedules` 행이 없는 채로 둬야 빈 상태(달 근무표
# 만들기)가 선다. 응답에 `month`(raw "YYYY-MM")·`monthLabel`(spellMonth)·
# `deadlineDate`(`kstDate(3)`, raw "YYYY-MM-DD" — 마감일 시트의 날짜 입력에
# 그대로 타이핑할 값)를 싣는다. `deadlineDate`는 화면에 그대로 찍히는 문구가
# 아니라 입력값이라 seed-session.js의 escapeForTextSelector를 안 거친다.
#
# ## schedule_admin_race_open (env MONTH, DAY)
#
# 세션을 새로 만들지 않는다 — 이미 로그인된 세션을 그대로 두고 그 사이에 다른
# 관리자가 날을 먼저 여는 것을 흉내 낸다. seed-session.js가 지금은 `state`·
# `name` 둘만 요청 본문에 담는데, 이 상태를 쓸 때는 env의 `MONTH`·`DAY`가 있으면
# `month`·`day` 필드로 같이 보내도록 넓혀야 한다(있을 때만 — 다른 상태를 쓰는
# 플로우가 이 필드 때문에 깨지면 안 된다). 서버는 `createAdminUser()`로 완전히
# 새 관리자를 하나 만들어(로그인된 세션과 무관한 사람이어야 진짜 경합처럼
# 된다) 그 계정으로 `open_day({ p_work_date: "${month}-${day}" })`를 부른다.
# 응답의 토큰은 이 플로우가 안 쓴다 — 세션을 안 바꾸므로 이어지는 `openLink`가
# 없다.
#
# **왜 이 방식인가.** 화면 문서 「날 열기 모드」가 "닫힌 날만 골라진다... 열린
# 날은 흐려지고 눌리지 않는다"고 정해서, 관리자 혼자 조작하는 한 이미 열린 날을
# 선택지에 섞을 방법이 없다. AC-04의 부분 실패는 화면이 그리는 시점(선택할 때는
# 닫혀 있었다)과 서버가 처리하는 시점(보낼 때는 이미 열려 있다) 사이의 경합이라,
# 실제로 그 틈을 만들려면 이 세션 밖에서 날을 여는 손이 필요하다.
#
# **부분 실패 토스트 문구가 schedule-admin.md 「날 열기 모드 문안」 표에
# 섰다**(커밋 `1111474`) — 「10월 10일은 열지 못했어요」, 실패가 둘 이상이면
# 「10월 10일 외 1일은 열지 못했어요」다. 그 이웃 행(날 닫기 경고 시트 제목
# 「10월 10일을 닫을까요?」)과 같은 표기라 요일 괄호가 없다 — 날 상세 앱바의
# 「10월 10일(토)」(`spellWorkDate`)와는 다른 꼴이다. 그래서 이 응답은 실패한
# 날짜 하나를 그 표기로 담아 돌려준다.
#
# **응답에 `failedOpenDayLabel`을 더 싣는다.** `` `${MONTH의 월}월 ${DAY의
# 일}일` `` 꼴이다(요일 없음 — `spellWorkDate`를 쓰지 않는다). 이 플로우는
# DAY로 "03" 하나만 보내 실패도 하나뿐이므로 단수형 문장("…은 열지 못했어요")만
# 확인한다 — 복수형("외 n개")은 이 액션 하나로는 못 만든다(실패가 둘 이상이
# 되려면 서로 다른 날짜에 이 액션을 두 번 걸어야 하는데, 이 파일의 배정에는
# 그 조각이 없다). seed-session.js는 이 값도 `escapeForTextSelector`로 감싸
# 내보낸다 — 지금 꼴엔 정규식 특수문자가 없어 실제로는 그대로 나가지만, 다른
# 동적 라벨과 같은 손을 타는 것으로 남겨둔다.
#
# ## schedule_admin_confirmable
#
# 관리자 하나, `withFreshMonth`로 고른 달에 `create_schedule(admin, monthDate,
# kstDate(1))` 뒤 `backdateDeadline`으로 마감일을 `kstDate(-1)`까지 당긴다 —
# schedule_admin_confirmed와 같은 손이다. **`confirm_schedule`은 부르지
# 않는다** — 마감이 지났고 아직 미확정인 채로 남겨야 이 플로우가 「확정하기」를
# 직접 눌러볼 수 있다. `open_day`로 1일을 연다. 배정은 하나도 안 만든다 —
# 이 task의 포지션 줄이 기본값 그대로 빈 자리로 남아 확정 시트의 경고
# 블록(빈 자리 넷까지·「외 n개」)이 저절로 선다. 응답은 다른 근무표 상태와
# 같은 꼴로 `month`(raw "YYYY-MM")·`monthLabel`(spellMonth)만 싣는다.
#
# ## schedule_admin_confirmed
#
# 관리자 하나, `withFreshMonth`로 고른 달에 `create_schedule`(마감일은 일단
# `kstDate(1)`로 만들고 `backdateDeadline`으로 `kstDate(-1)`까지 당긴다 —
# schedule-worker.yaml의 seedConfirmedMonth와 같은 손이다. `create_schedule`
# 함수 자체가 미래 마감일만 받는다), `open_day`로 1일만 연다(배정은 안
# 만든다 — 이 task의 날 상세가 배정을 세지 않아 필요 없다). 3일은 안
# 연 채로 남긴다 — 확정 뒤에도 「날 열기」가 되는 것을 보려면 열 날이
# 있어야 한다. `confirm_schedule`로 확정한다. 응답은 `month`·`monthLabel`만
# 싣는다.
#
# ## 이 task가 요청하는 testID 셋
#
# - `schedule-create-deadline-input` — 달 만들기 시트의 마감일 날짜 입력.
#   글자로 잡을 라벨이 없는 순수 입력 칸이다.
# - `schedule-deadline-input` — 마감일 바꾸기 시트(모아보기 줄과 확정 잠김의
#   「마감일 당기기」가 같이 여는 시트)의 날짜 입력. 이 파일은 이 시트를 열어서
#   내용만 확인하고 실제로 바꾸지는 않는다 — 아래 「못 쓴 것」에 이유를 적는다.
# - `schedule-confirm-sheet-button` — 확정 시트 안의 「<월> 근무표
#   확정하기」 버튼. BottomCTA의 열린 버튼과 글자가 완전히 같다(문안 표
#   「열린 버튼」과 「시트 버튼」 둘 다 「10월 근무표 확정하기」다) — 시트가
#   버튼 위에 겹쳐 뜨는 동안 같은 글자 둘이 있을 수 있어 members.yaml이
#   겪은 것과 같은 자리다.
#
# **날짜 입력 위젯과의 실제 상호작용(inputText로 "YYYY-MM-DD"를 그대로
# 받는지, 아니면 네이티브 피커라 다른 조작이 필요한지)은 한 번도 못
# 돌려봤다** — scripts/seed-session.js 머리말의 http.post 처럼, Maestro
# CLI로 실행해 실물 위젯을 보기 전까지는 확인할 수 없는 자리로 남는다.
#
# 텍스트 셀렉터는 정규식이다. 월·일처럼 오늘 날짜에 따라 바뀌는 문구는
# ".*"로 감싸 일부만 맞힌다 — schedule-worker.yaml처럼 시드가 라벨을
# 내려주는 대신, 여기서는 그 라벨이 필요한 자리에만 seed 응답값을 쓰고
# 나머지는 정규식으로 날짜 형식(연도 포함 여부 등)에 대한 가정을 줄인다.
#
# ================================================================
# schedule-requests task가 더하는 것 — 빈 자리에 근무 요청을 보낸다
# ================================================================
#
# 위 내용은 schedule-assign task가 쓴 것 그대로다(단언·스텝 불변). 아래는
# 그 task와 별개인 schedule-requests task가 파일 끝에 새 절로 붙인 것이다.
#
# 근거는 docs/2-design/spec/schedule-requests.md의 AC-01과
# docs/2-design/modules/schedule/screens/schedule-admin.md의 「근무 요청
# 보내기」·「포지션과 자리」다. 배정받은 리스크는(schedule-requests-test-plan.md
# 「배정 → e2e」)
#   - 전체 보기의 미신청 줄을 체크박스로 골라 「n명에게 근무 요청 보내기」 →
#     시트가 닫히고 자리 카드에 「요청 n건 대기 중」 배지가 얹힌다. 카드 문구는
#     「비어 있어요」 그대로다
#   - 같은 자리의 픽커를 다시 열면 그 줄들이 「요청 대기 중」으로 선다(체크박스
#     없음)
# 요청이 닫히는 다섯 갈래(수락·전부 소진·만료·자리 채워짐·날 닫힘)와 만료
# 시각 계산은 test-planner가 이미 integration으로 배정했다
# (schedule-requests-test-plan.md 「배정 → integration」) — 여기서는 화면·훅·
# 함수가 실제로 잇는지만 본다.
#
# 세션·딥링크 계약은 이 파일 위 머리말과 같다.
#
# **시드 서버에 상태 하나가 아직 없다 — implementer가 이 task에서 더한다.**
#
# ## schedule_admin_request_slot
#
# 관리자 하나, `withFreshMonth`로 고른 달의 1일을 연다. 근무 신청을 끝내 안
# 낸 승인된 근무자 둘 — 정하윤, 오수민 — 을 만든다(`createSignedInUser()` →
# `submitSeededProfile(user, { ...SEEDED_PROFILE, name })` →
# `decideBy("approve_member", user.profileId)`, `submit_availability`는 안
# 부른다). 안내 자리는 기본값 그대로 둘 다 비어 남는다.
#
# **아무도 신청을 안 낸 채로 두는 것이 이 상태의 핵심이다.** 픽커의 기본
# 목록(신청했고 배정 없고 자격 있는 사람)이 0명이 되어 [빈 목록] 규칙대로
# 전체 보기가 펼쳐진 채 열린다 — tests/e2e/schedule-assign.yaml의 스캔 자리
# 케이스와 같은 손이라, 이 플로우는 「전체 보기」를 따로 누르지 않는다.
#
# ```ts
# async function seedAdminRequestSlot(): Promise<SchedulePayload> {
#   const admin = await createAdminUser();
#
#   const workerA = await createSignedInUser();
#   await submitSeededProfile(workerA, { ...SEEDED_PROFILE, name: "정하윤" });
#   await decideBy("approve_member", workerA.profileId);
#
#   const workerB = await createSignedInUser();
#   await submitSeededProfile(workerB, { ...SEEDED_PROFILE, name: "오수민" });
#   await decideBy("approve_member", workerB.profileId);
#
#   return withFreshMonth(async (monthsFromNow) => {
#     const monthDate = kstMonthStart(monthsFromNow);
#     const month = monthDate.slice(0, 7);
#     const day = "01";
#     const workDate = `${month}-${day}`;
#
#     await createSchedule(admin, monthDate, kstDate(3));
#     await openDay(admin, workDate);
#
#     return { month, day, monthLabel: spellMonth(month) };
#   });
# }
# ```
#
# `SchedulePayload`는 안 늘어난다 — `month`·`day`·`monthLabel`뿐이라
# `schedule_assign_day`가 이미 쓰는 필드 그대로다. `STATES`·
# `ADMIN_STATES`·`schedulePayloadOf`에 `"schedule_admin_request_slot"`을
# `schedule_assign_day`와 같은 자리에 더한다. tests/e2e/scripts/seedSession.js는
# 안 고쳐도 된다 — 이미 있는 `if (seeded.day)` 통로를 그대로 탄다.
#
# 이 절이 요청하는 새 testID는 없다. `schedule-slot-안내-1`은
# schedule-assign.yaml이 이미 요청해서 서 있다.
#
# ================================================================
# payroll-adjust task가 더하는 것 — 임시공휴일 스위치와 근무 조정 시트
# ================================================================
#
# 위 내용 전부는 schedule-assign·schedule-requests 두 task가 쓴 것 그대로다(단언·
# 스텝 불변). 아래는 그 둘과 별개인 payroll-adjust task가 파일 끝에 새 절로 붙인
# 것이다. 이 절이 채우는 자리는 파일 머리 첫 절의 「날 상세 껍데기 — … 임시공휴일·
# 근무 조정은 없다(payroll-adjust 몫)」 줄이다 — 그 절 안의 assertNotVisible 둘도
# 위에서 고쳤다(무엇을 고쳤는지는 이 파일을 돌려준 보고에 있다).
#
# 근거는 docs/2-design/spec/payroll-adjust.md의 AC-01·AC-02·AC-04·AC-05와 상태
# 격자, docs/2-design/modules/schedule/screens/schedule-admin.md의 「근무 조정」과
# 「날 상세 문안」 표다. 배정받은 리스크는
#   - 배정이 있는 열린 날의 날 상세에 「임시공휴일」·「근무 조정」 줄이 선다
#   - 임시공휴일 스위치를 켜고 끈다. 받아온(`api`) 공휴일인 날은 스위치가 잠긴 채
#     「원래 공휴일이에요」가 선다
#   - 조정이 없으면 「근무 조정」 줄 오른쪽이 빈다(「0명 조정됨」이 아니다) → 누르면
#     시트가 열리고 머리·도움말·배정된 사람 줄이 선다
#   - 사람 줄 → 조정 고르기 시트(「결근이에요 · 연장이에요 · 닫기」, 「원래대로」
#     없음) → 「결근이에요」 → 즉시 반영 → 「결근 0시간」과 「1명 조정됨」
#   - 같은 사람을 다시 열면 「원래대로」가 있다 → 누르면 최종 시간이 되돌고
#     「N명 조정됨」이 다시 빈다
#   - 다른 사람에게 「연장이에요」 → 분 칸과 「닫기 · 바꾸기」 → 60분 넣고 바꾸면
#     최종 시간이 늘어난다
#   - 리허설이 있는 사람 줄 아래 「리허설 N건 · N시간」이 서고 눌러도 아무 일이
#     없다
# AC-03(줄마다의 최종 시간이 `payroll-data`의 순수 함수와 같은 값인지)은
# test-planner가 이미 unit으로 배정했다(payroll-adjust plan 「검증 방법」 AC-03
# 행) — 여기서는 화면이 그 값을 실제로 그리고, 관리자의 조작이 실제로 그 값을
# 바꾸는지만 본다.
#
# 세션·딥링크 계약은 이 파일 위쪽 머리말과 같다. 이 절 하나가 한 여정이라
# launchApp을 다시 하지 않는다 — schedule-requests 절처럼 새 runScript는 한 번만
# 돈다.
#
# **시드 서버에 상태 하나가 아직 없다 — implementer가 이 task에서 더한다.**
#
# ## payroll_adjust
#
# 관리자 하나, 열린 날 하나(그날 근무 시간을 `set_day_hours`로 10:00–19:00·9시간
# 고정 — 문안 표 예시("10:00–19:00 · 9시간", "박서연 · 9시간", "이하늘 11시간")와
# 같은 숫자를 써서 이 파일이 시간을 계산하지 않고 문안 표를 그대로 베낀다), 그날에
# 배정된 사람 셋, 그리고 `api` 공휴일이 심긴 다른 날짜 하나다.
#
# 사람 셋은 포지션이 갈려야 한다 — `freeSlotOf`는 점유 여부를 안 보고 그 날의 아무
# 슬롯이나 돌려줘서(day_id로만 거른다) 세 번 부르면 같은 자리를 세 번 줄 수 있다.
# `freeSlotOfPosition`으로 안내·스캔·메인 셋을 나눠 각자 다른 자리를 준다.
#
# ```ts
# const PAYROLL_ADJUST = "payroll_adjust";
#
# // STATES 배열과 ADMIN_STATES 집합 둘 다에 더한다 — 로그인하는 사람이 관리자다.
#
# async function seedPayrollAdjust(): Promise<Partial<SchedulePayload>> {
#   const admin = await createAdminUser();
#
#   const absentee = await createSignedInUser();
#   await submitSeededProfile(absentee, { ...SEEDED_PROFILE, name: "정민아" });
#   await decideBy("approve_member", absentee.profileId);
#
#   const overtimeWorker = await createSignedInUser();
#   await submitSeededProfile(overtimeWorker, { ...SEEDED_PROFILE, name: "한서준" });
#   await decideBy("approve_member", overtimeWorker.profileId);
#
#   const rehearsed = await createSignedInUser();
#   await submitSeededProfile(rehearsed, { ...SEEDED_PROFILE, name: "유하린" });
#   await decideBy("approve_member", rehearsed.profileId);
#
#   // 리허설 자격은 관리자가 주는 행이 유일한 길이다(schedule/design.md 「자격」).
#   await admin.client.rpc("grant_position", {
#     p_profile_id: rehearsed.profileId,
#     p_position: "리허설",
#   });
#
#   return withFreshMonth(async (monthsFromNow) => {
#     const monthDate = kstMonthStart(monthsFromNow);
#     const month = monthDate.slice(0, 7);
#     const day = "01";
#     const workDate = `${month}-${day}`;
#     const holidayDay = "05";
#     const holidayDate = `${month}-${holidayDay}`;
#
#     await createSchedule(admin, monthDate, kstDate(3));
#     await openDay(admin, workDate);
#     await openDay(admin, holidayDate); // 날 상세로 들어가려면 열려 있어야 한다
#
#     await admin.client.rpc("set_day_hours", {
#       p_work_date: workDate,
#       p_starts: "10:00",
#       p_ends: "19:00",
#     });
#
#     const dayId = await dayIdOf(admin, workDate);
#
#     seedAssignment(dayId, absentee.profileId, "regular", await freeSlotOfPosition(admin, dayId, "안내"));
#     seedAssignment(dayId, overtimeWorker.profileId, "regular", await freeSlotOfPosition(admin, dayId, "스캔"));
#     seedAssignment(dayId, rehearsed.profileId, "regular", await freeSlotOfPosition(admin, dayId, "메인"));
#
#     // 정규 배정이 이미 있는 날이라 갈래가 "count"로 판정된다(rehearsal_functions.sql
#     // internal.rehearsal_kind_of) — 화면이 부르는 것과 같은 함수를 그대로 쓴다.
#     await rehearsed.client.rpc("add_rehearsal", {
#       p_work_date: workDate,
#       p_count: 2,
#     });
#
#     // `api` 공휴일은 `internal.import_holidays`로만 들어가는데 그 함수가 internal이라
#     // PostgREST로 못 부른다 — `seedWageHistory`·`backdateDeadline`과 같은 손으로 직접
#     // 심는다. tests/integration/postgres.ts에 새 헬퍼가 필요하다.
#     seedHoliday(holidayDate, "api", "대체공휴일");
#
#     return { month, day, holidayDay };
#   });
# }
# ```
#
# `tests/integration/postgres.ts`에 더할 헬퍼:
#
# ```ts
# export function seedHoliday(
#   holidayDate: string,
#   source: "api" | "manual",
#   name: string | null = null,
# ): void {
#   execSql(
#     "insert into public.holidays (holiday_date, source, name) " +
#       "values (:'holiday_date', :'source', :'name')\n" +
#       "on conflict (holiday_date, source) do update set name = excluded.name;\n",
#     { holiday_date: holidayDate, source, name: name ?? "" },
#   );
# }
# ```
#
# `SchedulePayload`에 `holidayDay?: string`을 더한다. `month`·`day`는 이미 있는
# 필드라 안 늘어난다. 이 상태는 `monthLabel`을 안 싣는다 — 이 절이 달력을 한 번도
# 안 거치고 두 날짜 다 `?date=` 딥링크로 바로 들어가서다.
#
# ## 이 절이 요청하는 testID 둘
#
# - `schedule-holiday-switch` — 임시공휴일 스위치. docs/2-design/design-system/
#   components.md의 「스위치」가 "스위치 안에는 글자를 넣지 않는다"고 정해서,
#   라벨 텍스트 "임시공휴일"을
#   `tapOn`해도 그 텍스트 자체가 스위치를 감싼 손잡이인지가 이 층에서 안 보인다 —
#   `schedule-create-deadline-input`과 같은 이유(글자로 못 잡는 순수 컨트롤)다.
# - `adjustment-extra-minutes-input` — 조정 고르기 시트의 연장 분 입력 칸.
#   문안 표가 "빈 칸에는 힌트가 없다"고 정해서 `wage-amount-input`과 같은 자리다.
#
# **스위치의 잠김을 `enabled: false`로 재는 것은 이 파일이 한 번도 못 돌려본
# 가정이다.** `wages.yaml`이 Button에 쓴 것과 같은 속성이 RN `Switch`에도
# 그대로 잡히는지 Maestro CLI로 확인한 적이 없다 — 아래 「이슈」에 적는다.
#
# **안 쓰는 것.**
#   - 저장 실패(통신 끊김) — Maestro가 네트워크를 못 끊는다. 위 파일들과 같은
#     이유로 손으로 본다.
#   - 함수 직접 호출 거절(근무자·배정 없는 사람) — integration이 이미 덮는다
#     (payroll-adjust plan AC-06, 검증 층 integration).
#   - 동시 변경(다른 관리자가 그 사이 배정을 빼 저장이 `not_allowed`로 걸리는 것)
#     — `schedule_admin_race_open`이 쓴 것과 같은 종류의 손(로그인 세션 밖에서
#     다른 관리자로 먼저 어떤 상태를 바꿔놓는 것)이 필요한데, 이번 task는 그
#     경합까지 배정받지 않았다. AC-03처럼 상태 격자에 있어도 이 절의 배정 여덟
#     걸음 밖이면 안 만든다.
#
# 텍스트 셀렉터는 정규식이다. 「?」가 든 문구는 이스케이프한다. 이 절의 문구는
# 전부 schedule-admin.md 「날 상세 문안」 표에서 그대로 옮겼다 — 사람 이름·시간
# 숫자만 이 파일이 고른 값이다.
appId: com.labiebelle.app
---
- launchApp:
    clearState: true
    clearKeychain: true

# ================================================================
# 빈 달 → 마감일 시트 → 만들기 → 만든 직후 안내
# ================================================================
- runScript:
    file: scripts/seed-session.js
    env:
      STATE: schedule_admin_empty_month
- openLink: "labiebelle://__test/session?access_token=${output.accessToken}&refresh_token=${output.refreshToken}"
- openLink: "labiebelle://admin/schedule?month=${output.month}"

- assertVisible: ".*근무표가 아직 없어요"
- assertVisible: ".*근무표 만들기"
- tapOn: ".*근무표 만들기"

- assertVisible: "스케줄 신청 마감일"
- assertVisible: "오늘 이전은 고를 수 없어요"
- tapOn:
    id: "schedule-create-deadline-input"
- inputText: "${output.deadlineDate}"
- tapOn: "만들기"

- assertVisible: "전부 닫힌 날이에요. 예식 있는 날을 열어주세요"
- assertVisible: "날 열기"

# ================================================================
# 날 열기 모드 — 셋을 고르고, 그중 하나가 보내는 사이에 다른 관리자 손으로
# 먼저 열려 부분 실패가 난다
# ================================================================
- tapOn: "날 열기"
- assertVisible: "그만두기"
- assertVisible: "열 날을 고르세요"
- assertVisible: "닫힌 날만 고를 수 있어요"

- tapOn:
    id: "schedule-day-${output.month}-02"
- tapOn:
    id: "schedule-day-${output.month}-03"
- tapOn:
    id: "schedule-day-${output.month}-04"
- assertVisible:
    id: "schedule-day-${output.month}-02-selected"
- assertVisible:
    id: "schedule-day-${output.month}-03-selected"
- assertVisible:
    id: "schedule-day-${output.month}-04-selected"
- assertVisible: "3일 열기"

# --- 여기서 03일이 다른 관리자에 의해 먼저 열린다(위 계약 참고) ---
- runScript:
    file: scripts/seed-session.js
    env:
      STATE: schedule_admin_race_open
      MONTH: "${output.month}"
      DAY: "03"

- tapOn: "3일 열기"

# --- 부분 실패 확인 — 실패한 날짜를 토스트가 말하고, 하나라도 실패하면
# 모드가 안 풀린다(성공이면 여기서 이미 달력으로 돌아가 「그만두기」가 안
# 보였을 것이다) ---
- assertVisible: "${output.failedOpenDayLabel}은 열지 못했어요"
- assertVisible: "그만두기"
- assertVisible: "열 날을 고르세요"
- tapOn: "그만두기"
- assertVisible: "${output.monthLabel}"

# ================================================================
# 날 상세 껍데기 — 근무 시간 줄·근무 신청 줄만, 임시공휴일·근무 조정은 없다.
# 배정이 없으니 이 날 닫기는 확인 없이 바로 닫힌다.
# ================================================================
- tapOn:
    id: "schedule-day-${output.month}-02"
- assertVisible: ".*근무 시간.*"
# payroll-adjust가 이 둘을 채웠다 — 배정 없는 날에도 줄 자체는 선다(오른쪽 셈만
# 빈다). 이전엔 "줄이 아직 없다"는 assertNotVisible이었다 — 이 화면이 이제 그
# 줄들을 그려서 반대로 고쳤다(payroll-adjust task).
- assertVisible: "임시공휴일"
- assertVisible: "근무 조정"
- assertNotVisible: "근무 신청"

- tapOn: ".*근무 시간.*"
- assertVisible: "출근"
- assertVisible: "퇴근"
- assertVisible: "이 날 배정된 전원에게 같이 적용돼요"
- assertVisible: "바꾸기"
- tapOn: "닫기"

- tapOn: "이 날 닫기"
- assertVisible: "${output.monthLabel}"

# ================================================================
# 확정 잠김 — 마감일이 아직 안 지났다. 「마감일 당기기」가 모아보기와 같은
# 마감일 시트를 연다.
# ================================================================
- assertVisible: "확정하기"
- assertVisible: ".*확정할 수 있어요.*"
- assertVisible: "마감일 당기기"
- tapOn: "마감일 당기기"
- assertVisible: "스케줄 신청 마감일"
- assertVisible: "오늘 이전은 고를 수 없어요"
- assertVisible: "바꾸면 전원에게 알림이 가요"
- assertVisible: "바꾸기"
- tapOn: "닫기"

# ================================================================
# 확정 가능한 달 — 마감이 지나 「확정하기」가 열린다. 시트 → 확정 → 같은
# 시트 안에서 결과 → 닫으면 배지·확정 줄. 실패 경로는 위 머리말에 적은
# 이유로 뺐다.
# ================================================================
- runScript:
    file: scripts/seed-session.js
    env:
      STATE: schedule_admin_confirmable
- openLink: "labiebelle://__test/session?access_token=${output.accessToken}&refresh_token=${output.refreshToken}"
- openLink: "labiebelle://admin/schedule?month=${output.month}"

- assertVisible: ".*근무표 확정하기"
- tapOn: ".*근무표 확정하기"

- assertVisible: ".*확정할까요\\?"
- assertVisible: "빈 자리 .*개가 있어요"
- assertVisible: "외 .*개"
- assertVisible: "빈 자리는 확정 뒤에도 채울 수 있어요"
- assertVisible: "확정하면 근무자 전원에게 보여요 · 되돌릴 수 없어요"

- tapOn:
    id: "schedule-confirm-sheet-button"

# 결과는 같은 시트 안에서 난다. 1.65초 뒤 저절로 닫힌다는 것을 고정 대기로
# 기다리지 않고, assertVisible이 스스로 기다리는 것으로 그 너머(달력의 확정
# 줄)까지 확인한다 — 그 줄은 시트의 결과 문구와 글자가 갈려서(시트는
# 「<월> 근무표를 확정했어요」와 「배정된 n명에게 알림을 보냈어요」 두 줄로,
# 달력은 「<일>에 확정했어요 · n명에게 알림을 보냈어요」 한 줄로 다르게
# 합친다) 이 정규식은 시트가 완전히 닫히고 달력으로 돌아온 뒤에만 맞는다.
- assertVisible: ".*확정했어요.*알림을 보냈어요"
- assertVisible: "확정"
- assertNotVisible: ".*근무표 확정하기"

# ================================================================
# 확정된 달 — 배지·확정 줄, 마감 줄·BottomCTA·범례·모아보기 줄 부재. 확정
# 뒤에도 「날 열기」가 되고 새로 연 날에도 「이 날 닫기」가 없다.
# ================================================================
- runScript:
    file: scripts/seed-session.js
    env:
      STATE: schedule_admin_confirmed
- openLink: "labiebelle://__test/session?access_token=${output.accessToken}&refresh_token=${output.refreshToken}"
- openLink: "labiebelle://admin/schedule?month=${output.month}"

- assertVisible: ".*확정했어요.*알림을 보냈어요"
- assertNotVisible: ".*스케줄 신청 마감.*"
- assertNotVisible: "확정하기"
- assertNotVisible: "사람 표시는 근무 신청이에요"
- assertNotVisible: ".*근무 신청.*모아보기"

- tapOn: "날 열기"
- tapOn:
    id: "schedule-day-${output.month}-03"
- assertVisible:
    id: "schedule-day-${output.month}-03-selected"
- tapOn: "1일 열기"

- tapOn:
    id: "schedule-day-${output.month}-03"
- assertNotVisible: "이 날 닫기"

# ================================================================
# 근무 요청 보내기 — schedule-requests task. 신청 안 한 근무자 둘에게 빈
# 자리 요청을 보내고, 자리 카드 배지와 재진입 상태를 본다.
# ================================================================
- runScript:
    file: scripts/seed-session.js
    env:
      STATE: schedule_admin_request_slot
- openLink: "labiebelle://__test/session?access_token=${output.accessToken}&refresh_token=${output.refreshToken}"
- openLink: "labiebelle://admin/schedule?date=${output.month}-${output.day}"

- tapOn:
    id: "schedule-slot-안내-1"
- assertVisible: "지금 바로 넣을 수 있는 사람이 없어요"
- assertVisible: "정하윤"
- assertVisible: "오수민"
- tapOn: "정하윤"
- tapOn: "오수민"
- assertVisible: "2명에게 근무 요청 보내기"
- tapOn: "2명에게 근무 요청 보내기"

- assertVisible: "비어 있어요"
- assertVisible: "요청 2건 대기 중"

# --- 같은 자리를 다시 열면 방금 보낸 둘이 「요청 대기 중」으로 선다(체크박스
# 없음 — 이미 나가 있는 요청이라 다시 고를 게 없다) ---
- tapOn:
    id: "schedule-slot-안내-1"
- assertVisible: "요청 대기 중"

# ================================================================
# payroll-adjust — 임시공휴일 스위치와 근무 조정. 배정 있는 열린 날의 날 상세로
# 들어가 두 줄을 확인하고, 다른 날짜의 받아온 공휴일에서 스위치 잠김을 보고,
# 돌아와 결근·되돌리기·연장을 차례로 겪고, 리허설 줄이 안 눌리는 것까지 한
# 여정으로 간다.
# ================================================================
- runScript:
    file: scripts/seed-session.js
    env:
      STATE: payroll_adjust
- openLink: "labiebelle://__test/session?access_token=${output.accessToken}&refresh_token=${output.refreshToken}"
- openLink: "labiebelle://admin/schedule?date=${output.month}-${output.day}"

# --- 임시공휴일·근무 조정 두 줄이 선다 ---
- assertVisible: "임시공휴일"
- assertVisible: "급여를 셀 때 공휴일로 봐요"
- assertVisible: "근무 조정"

# --- 임시공휴일 스위치를 켜고 끈다(이 날은 받아온 공휴일이 아니라 잠기지 않는다) ---
- tapOn:
    id: "schedule-holiday-switch"
- tapOn:
    id: "schedule-holiday-switch"

# --- 별도로 api 공휴일이 심긴 날짜로 들어가 스위치 잠김을 본다 ---
- openLink: "labiebelle://admin/schedule?date=${output.month}-${output.holidayDay}"
- assertVisible: "임시공휴일"
- assertVisible: "원래 공휴일이에요"
- assertVisible:
    id: "schedule-holiday-switch"
    enabled: false

# --- 배정이 있는 날로 돌아온다. 아직 조정이 없어 「근무 조정」 오른쪽이 비어
# 있다 — 「0명 조정됨」이 아니라 그 문구 자체가 없다 ---
- openLink: "labiebelle://admin/schedule?date=${output.month}-${output.day}"
- assertNotVisible: ".*명 조정됨"

- tapOn: "근무 조정"
- assertVisible: "근무 조정"
- assertVisible: "출근 인증이 없는 날은 급여에서 따로 빠져요"
- assertVisible: "10:00–19:00 · 9시간"
- assertVisible: "정민아 · 9시간"
- assertVisible: "한서준 · 9시간"
- assertVisible: "유하린 · 11시간"
- assertVisible: "리허설 2건 · 2시간"

# ================================================================
# 결근 — 즉시 반영되고 「1명 조정됨」
# ================================================================
- tapOn: "정민아 · 9시간"
- assertVisible: "정민아"
- assertVisible: "결근이에요"
- assertVisible: "연장이에요"
- assertNotVisible: "원래대로"
- tapOn: "결근이에요"

# 고른 즉시 반영되고 조정 시트(목록)로 돌아온다.
- assertVisible: "정민아 · 결근 0시간"
- back

- assertVisible: "1명 조정됨"

# ================================================================
# 원래대로 — 조정 행이 있는 사람에게만 뜨고, 누르면 되돌아가 「N명 조정됨」이
# 다시 빈다
# ================================================================
- tapOn: "근무 조정"
- tapOn: "정민아 · 결근 0시간"
- assertVisible: "원래대로"
- tapOn: "원래대로"

- assertVisible: "정민아 · 9시간"
- back

- assertNotVisible: ".*명 조정됨"

# ================================================================
# 연장 — 분 칸이 열리고 버튼이 「닫기 · 바꾸기」, 60분을 넣으면 최종 시간이
# 한 시간 는다
# ================================================================
- tapOn: "근무 조정"
- tapOn: "한서준 · 9시간"
- assertVisible: "한서준"
- assertVisible: "결근이에요"
- assertVisible: "연장이에요"
- assertNotVisible: "원래대로"
- tapOn: "연장이에요"

- assertVisible: "몇 분 더 일했나요?"
- assertVisible: "배정 9시간에 더해져요"
- assertVisible: "닫기"
- assertVisible: "바꾸기"
- tapOn:
    id: "adjustment-extra-minutes-input"
- inputText: "60"
- tapOn: "바꾸기"

- assertVisible: "한서준 · 연장 10시간"

# ================================================================
# 리허설 줄 — 이름 아래 작은 줄로 서고 눌러도 아무 일이 없다(wages.yaml의
# 「이력 줄 눌러도 아무 일 없음」과 같은 손)
# ================================================================
- assertVisible: "유하린 · 11시간"
- assertVisible: "리허설 2건 · 2시간"
- tapOn: "리허설 2건 · 2시간"

# 조정 고르기 시트가 안 열린다 — 여전히 조정 시트(목록)다.
- assertNotVisible: "결근이에요"
- assertVisible: "근무 조정"
