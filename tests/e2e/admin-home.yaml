# 관리자 홈 — 관리자가 스위치로 들어와서 근무표 관리 타일의 지금 상태를 보고,
# 근무 시간 기본값을 시트에서 고쳐 줄 값이 바뀌는 것을 보고, 나머지 여섯 줄이
# 각자의 자리로 가는 것까지 한 여정으로 간다.
#
# 근거는 docs/2-design/spec/schedule-admin.md(AC-01)와
# docs/2-design/system/screens/admin-home.md다. 배정받은 리스크는
# (schedule-admin-test-plan.md 「배정 → e2e」)
#   - 타일에 지금 달 상태(근무표 없음)가 한 줄로 선다
#   - 근무 시간 기본값 줄 → 시트 → 출근·퇴근 고침 → 줄 값이 그 자리에서 갱신된다
#   - 줄 여섯(승인할 일·가입 대기·직원·시급·QR·통계)이 눌린다 — 아직 안 지은
#     화면도 눌린다
#   - 오늘 배정이 없는 날은 오늘 현황 자리가 통째로 없다
# 업무 규칙의 경우의 수(빈 자리 카드의 사흘 판정, 미니뷰 진하기 계산 등)는
# test-planner가 이미 unit으로 배정했다(schedule-admin-test-plan.md
# 「배정 → unit」의 vacancy-cards.test.ts·mini-view-density.test.ts) — 여기서는
# 그 화면이 실제로 라우트·훅·API를 잇는지만 본다.
#
# **미니뷰의 「값이 있다/없다」(칸의 진하기)는 이 층이 못 잰다.** 배정 인원이
# 많을수록 진해지는 것은 배경색뿐이고 칸에는 날짜 숫자만 있다(admin-home.md
# 「이번 달 근무표 미니뷰」 표) — 색은 스타일이라 assertVisible로 못 본다
# (strategy 「공통 검증 기준과 대역의 한계」, schedule-worker.yaml의 같은
# 판정과 같다). 미니뷰 자체는 근무표가 없어도 날짜 그리드로 선다고 읽혀서 —
# 「자리가 빠지면 위 간격을 이어받는다」 절이 빠지는 자리로 든 것은 빈 자리
# 카드뿐이고 미니뷰는 그 목록에 없다 — 이 파일은 미니뷰의 있고 없음을
# 단언하지 않는다. 아래 「못 쓴 것」에 적는다.
#
# **오늘 현황이 실제 값으로 차는 것도 이 파일에서 못 만든다.** 그 줄은 화면이
# 연 달이 아니라 기기의 진짜 오늘 날짜를 본다(admin-home.md — 「그날 배정
# 인원」의 「그날」이 오늘이다). schedule_confirmed류 시드는 전부
# withFreshMonth로 몇만 달 뒤의 무작위 달을 고르는 방식이라(관리자
# 근무표 e2e 전체가 이 패턴이다 — 실제 오늘과 절대 안 겹친다) 오늘 배정을
# 만들려면 진짜 오늘 달에 스케줄을 심어야 하는데, 그러면 이 플로우를 두 번
# 돌릴 때 같은 달에 또 만들려다 이미 있는 스케줄과 부딪힌다(다른 모든 시드가
# 무작위 먼 달을 쓰는 이유가 바로 이 충돌을 피하는 것이다). 그래서 이 파일은
# 「오늘 배정이 없다 → 자리가 없다」쪽만 확인하고 값이 채워지는 쪽은 안
# 만든다 — 아래 「못 쓴 것」에 적는다.
#
# 세션은 개발 빌드의 테스트 문과 시드 서버로 심는다 — 계약은
# tests/e2e/schedule-worker.yaml 머리말과 scripts/e2e-seed-server.mts를
# 따른다. "admin" 상태는 이미 있다(스케줄을 하나도 안 만든다). 딥링크는
# navigation.md 「경로」의 "/admin" 그대로다.
#
# **admin 시드는 자기 프로필을 안 보낸다**(members.yaml의 같은 주석과 같다) —
# 로그인한 관리자 자신은 이 화면의 근무자 수·오늘 현황 어디에도 안 낀다.
#
# 아래 줄 여섯 중 "직원"·"가입 대기"는 이미 지어진 화면(members·
# members-pending)이라 그 안까지 들어가지 않는다 — 그 화면의 몫은
# members.yaml·members-pending.yaml이 이미 진다. 이 파일은 아직 안 지어진
# "시급" 하나만 눌러 NotBuiltYet까지 닿는 것으로 「아직 없는 화면으로 가는
# 줄도 눌린다」(spec AC-01)를 확인한다 — admin.yaml이 "/admin/members/pending"에
# 쓴 같은 문구("아직 없다"와 그 경로)를 그대로 본다.
#
# ## 이 task가 요청하는 testID 셋
#
# - `admin-home-today-status` — 오늘 현황 자리 전체를 감싸는 컨테이너. 그
#   자리의 이름표가 "9월 27일(토)"처럼 매일 바뀌는 날짜라 고정 글자로 있고
#   없음을 잡을 수 없다 — 스케줄이 하나도 없을 때 이 자리가 통째로 없는지를
#   보려면 이 testID가 있어야 한다.
# - `hall-defaults-start-input`·`hall-defaults-end-input` — 근무 시간
#   기본값 시트의 출근·퇴근 입력 칸. "출근"·"퇴근" 글자는 라벨일 뿐 입력
#   가능한 칸을 가리키지 않는다.
#
# **시간 입력 위젯과의 실제 상호작용도 schedule-admin.yaml의 날짜 입력과 같은
# 자리에 있다** — Maestro로 한 번도 못 돌려봐서 inputText가 그대로 먹는지
# 확인이 안 됐다.
#
# 텍스트 셀렉터는 정규식이다.
appId: com.labiebelle.app
---
- launchApp:
    clearState: true
    clearKeychain: true

- runScript:
    file: scripts/seed-session.js
    env:
      STATE: admin
- openLink: "labiebelle://__test/session?access_token=${output.accessToken}&refresh_token=${output.refreshToken}"
- openLink: "labiebelle://admin"

# --- 진입: 타일에 지금 달 상태가 한 줄로 선다(근무표 없음) ---
- assertVisible: "관리자"
- assertVisible: "근무표 관리"
- assertVisible: ".*근무표가 아직 없어요"

# --- 오늘 배정이 없으니 오늘 현황 자리가 통째로 없다 ---
- assertNotVisible:
    id: "admin-home-today-status"

# --- 근무 시간 기본값 줄 → 시트 → 고침 → 줄 값 갱신 ---
- tapOn: "근무 시간 기본값.*"
- assertVisible: "근무 시간 기본값"
- assertVisible: "출근"
- assertVisible: "퇴근"
- assertVisible: "날을 열면 이 시간이 깔려요. 이미 연 날은 그대로예요"

- tapOn:
    id: "hall-defaults-start-input"
- eraseText: 10
- inputText: "11:00"
- tapOn:
    id: "hall-defaults-end-input"
- eraseText: 10
- inputText: "20:00"
- tapOn: "바꾸기"

- assertVisible: ".*11:00.*20:00.*"

# --- 줄 여섯이 눌린다. 이미 지어진 둘은 문만 확인하고 안 들어간다 ---
- assertVisible: "승인할 일"
- assertVisible: "가입 대기"
- assertVisible: "직원"
- assertVisible: "QR"
- assertVisible: "통계"

- tapOn: "시급"
- assertVisible: "아직 없다"
- assertVisible: "/admin/wages"
