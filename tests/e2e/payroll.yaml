# ## 이슈 — 이 파일이 깔고 가는 가정
#
# - **`spellMonth`·`spellWorkDate` 재사용 가정.** 급여 화면이 아직 없어 이 화면이 정말
#   같은 포맷 함수를 쓸지, 아니면 새 포맷터를 따로 만들지는 구현이 정한다. 새로
#   만들면서 꼴이 달라지면(예: 요일 괄호 표기가 다르면) 이 파일의 라벨 단언이 전부
#   깨진다.
# - **`lastMonthShortLabel`·`secondMonthShortLabel`("10월" 꼴)을 이 시드가 직접
#   문자열로 만든다.** 화면이 "연" 목록 줄 제목을 다른 함수·다른 꼴(예: 앞에 0을 붙인
#   "03월")로 내면 이 파일이 깨진다.
# - 닫혔다: 리허설만 있는 날의 보조 정보 문구. payroll.md 「급여 조회 문안」 표에
#   「리허설 2시간」이 서서 이 파일이 그 줄을 단언한다.
# - 닫혔다: 승인된 달이 지난달보다 늦던 자리. 뒤로 가는 화살표의 바닥은 승인된 달이고
#   (PAY-025) 승인 함수가 넣는 시급 행의 적용일은 오늘이라(PAY-008), 오늘 승인된 사람은
#   지난달에 닿지도 못하고 닿아도 그날 시급이 없었다. `seedPayrollView`가 `approveProfile`과
#   `seedWageHistory`로 둘을 근무가 선 두 달 중 이른 달의 1일로 내린다.
# - 닫혔다: `set_default_wage`가 승인보다 먼저 서야 한다는 순서 의존. `seededUser`가 이
#   상태 둘만 승인 앞에서 기본 시급을 세운다 — PAY-012대로 "따로 정하지 않은 사람"이
#   되려면 승인 시점에 기본 시급이 이미 서 있어야 한다(`payroll_wages`도 같은 순서를 진다).
# - **`add_rehearsal`이 퇴사자를 막는지 확인 안 됐다.** `is_approved()`의 정의가
#   "승인됨과 미퇴사"를 같이 보는지, "승인됨"만 보는지 이 저장소 코드로 못 읽었다(화면이
#   없어 함수도 아직 없다). 막는 쪽이면 이 파일이 짠 순서(승인 → 리허설 → 퇴사)가
#   맞고, 안 막는 쪽이면 순서를 안 지켜도 되지만 그렇다고 틀리지는 않는다.
# - **"주" 세그먼트의 정확한 기간 줄 문구를 안 단언한다.** 세그먼트를 바꿀 때 화면이
#   어느 날을 기준으로 "이번 주"를 고르는지(오늘 기준인지, 보던 달의 기준일인지)가
#   문서에 안 적혀 있다 — 그래서 이 파일은 월 라벨이 사라지는 것만 보고 정확한 주
#   날짜 범위 문구는 안 잰다. 그 계산 자체는 spec AC-02가 이미 unit에 배정했다.
# - **연장 붙은 날·리허설만 있는 날·둘째 달의 금액(126,000원·24,000원·108,000원·
#   150,000원·258,000원)은 전부 이 파일이 손으로 계산한 값이다.** README.md PAY-005의
#   원문 예시(12,000원×10시간=126,000원)와 payroll.md 문안 표의 예시(108,000원)를 그대로
#   가져와 검산했지만, 실제 구현이 이 파일이 모르는 규칙(예: 리허설 시간의 반올림)을
#   더 가지고 있으면 숫자가 어긋날 수 있다.
#
# ## 이 task가 요청하는 testID 다섯
#
# - `payroll-period-prev`·`payroll-period-next` — 기간 줄 좌우 화살표. 아이콘만 있고
#   글자가 없어 스케줄 근무표의 `schedule-month-prev`·`schedule-month-next`와 같은
#   자리다.
# - `payroll-segment-week`·`payroll-segment-month`·`payroll-segment-year` — 주·월·연
#   세그먼트 칸. 글자 자체는 "월"·"주"·"연"이지만 기간 줄 라벨("2026년 10월")이 이미
#   "월"을 포함하고 있어 텍스트 셀렉터(부분 일치, wages.yaml의 "기본" 사례 참고)로
#   세그먼트만 집을 수 없다 — 그래서 칸을 testID로 요청한다.
#
# 텍스트 셀렉터는 정규식이다. 문안에 물음표는 없다.
appId: com.labiebelle.app
---
- launchApp:
    clearState: true
    clearKeychain: true

# ================================================================
# AC-01 — 처음 열면 「월」이고 이번 달은 비어 있다. 예상치 안내 한 줄.
# 상태 격자 「빈 상태」 — 금액 자리는 「–」로 서고 그 아래에만 빈 상태가 온다.
# ================================================================
- runScript:
    file: scripts/seed-session.js
    env:
      STATE: payroll_view
- openLink: "labiebelle://__test/session?access_token=${output.accessToken}&refresh_token=${output.refreshToken}"
- openLink: "labiebelle://payroll"

- assertVisible: "급여"
- assertVisible: "${output.currentMonthLabel}"
- assertVisible: "예상치예요. 실제 지급액과 다를 수 있어요"
- assertVisible: "–"
- assertVisible: "아직 근무가 없어요"
- assertVisible: "근무한 날이 생기면 여기 서요"

# --- 세그먼트를 「주」로 바꾸면 월 라벨이 사라진다 — 왕복해도 「월」 상태가 그대로다 ---
- tapOn:
    id: "payroll-segment-week"
- assertNotVisible: "${output.currentMonthLabel}"
- tapOn:
    id: "payroll-segment-month"
- assertVisible: "${output.currentMonthLabel}"
- assertVisible: "아직 근무가 없어요"

# ================================================================
# AC-02·AC-04 — 이전 달 화살표로 지난달로 간다. 라벨과 금액이 따라 바뀌고, 내역
# 목록에 연장 붙은 날·결근한 날·리허설만 있는 날이 선다. 줄을 눌러도 다음 화면이
# 없다.
# ================================================================
- tapOn:
    id: "payroll-period-prev"
- assertVisible: "${output.monthLabel}"
- assertNotVisible: "${output.currentMonthLabel}"

- assertVisible: "${output.overtimeDateLabel}"
- assertVisible: "메인 · 10:00–20:00 · 연장 1시간"
- assertVisible: "126,000원"

- assertVisible: "${output.absentDateLabel}"
- assertVisible: "결근"

- assertVisible: "${output.rehearsalOnlyDateLabel}"
- assertVisible: "리허설 2시간"
- assertVisible: "24,000원"

- assertVisible: "150,000원"

# --- 줄을 눌러도 아무 일이 없다 ---
- tapOn: "${output.overtimeDateLabel}"
- assertVisible: "급여"
- assertVisible: "${output.overtimeDateLabel}"
- assertVisible: "126,000원"

# ================================================================
# AC-05 — 「연」으로 바꾸면 달마다 한 줄로 접히고 맨 아래에 합계 줄이 선다(안
# 눌린다). 달 줄을 누르면 「월」로 바뀌고 그 달로 간다.
# ================================================================
- tapOn:
    id: "payroll-segment-year"
- assertVisible: "${output.yearLabel}"
- assertVisible: "${output.lastMonthShortLabel}"
- assertVisible: "150,000원"
- assertVisible: "${output.secondMonthShortLabel}"
- assertVisible: "108,000원"
- assertVisible: "합계"
- assertVisible: "258,000원"

# --- 합계 줄은 안 눌린다 — 눌러도 여전히 연 목록이다 ---
- tapOn: "합계"
- assertVisible: "합계"
- assertVisible: "${output.secondMonthShortLabel}"

# --- 지난달 줄을 누르면 「월」로 바뀌고 그 달로 간다 ---
- tapOn: "${output.lastMonthShortLabel}"
- assertVisible: "${output.monthLabel}"
- assertVisible: "${output.overtimeDateLabel}"

# --- 다음 달 화살표로 「이번 달」로 되돌아온다 — 빈 상태가 다시 보인다 ---
- tapOn:
    id: "payroll-period-next"
- assertVisible: "${output.currentMonthLabel}"
- assertVisible: "아직 근무가 없어요"

# ================================================================
# AC-06 — 퇴사한 사람이 /left의 「급여 보기」로 들어온다. 탭 바가 없고 앱바 뒤로가
# /left다. 퇴사한 달(=이번 달, 방금 퇴사시켰다)에서 앞으로 가는 화살표가 사라지고,
# 지난 급여는 그대로 다 보인다.
# ================================================================
- runScript:
    file: scripts/seed-session.js
    env:
      STATE: payroll_view_left
- openLink: "labiebelle://__test/session?access_token=${output.accessToken}&refresh_token=${output.refreshToken}"

# 퇴사자는 앱을 열면 게이트가 곧장 /left로 보낸다(left.yaml과 같은 진입).
- assertVisible: "근무를 마치셨어요"
- tapOn: "급여 보기"

- assertVisible: "급여"
- assertVisible: "${output.currentMonthLabel}"
- assertNotVisible: "근무표"
- assertNotVisible:
    id: "payroll-period-next"

# --- 이전 달 화살표는 살아 있다 — 지난 급여가 그대로 보인다 ---
- tapOn:
    id: "payroll-period-prev"
- assertVisible: "${output.monthLabel}"
- assertVisible: "${output.overtimeDateLabel}"
- assertVisible: "126,000원"
- assertVisible: "${output.absentDateLabel}"
- assertVisible: "결근"

# --- 앱바 뒤로는 /left로 간다 ---
- back
- assertVisible: "근무를 마치셨어요"
