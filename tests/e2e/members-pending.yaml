# 가입 대기 화면 — 관리자가 대기자를 승인하고, 차단한 사람을 다시 푼다.
#
# 근거는 docs/2-design/modules/account/screens/membersPending.md다. 배정받은
# 리스크는 「목록 → 상세 시트 → 승인 → 토스트·줄 사라짐」과 「차단 목록 →
# 차단 풀기 → 토스트·줄 사라짐」 둘이다. 업무 규칙의 경우의 수(already_decided
# 조건 전부, 동시 처리 경합 등)는 test-planner가 integration으로 이미 배정했다
# — 여기서는 그 규칙이 실제로 화면·API·DB를 잇는지만 본다.
#
# 세션은 개발 빌드의 테스트 문과 시드 서버로 심는다 — 계약은
# tests/e2e/pending.yaml 머리말, scripts/e2eSeedServer.mts, 이 task 리턴을 본다.
#
# **시드 상태 "admin"이 아직 없다.** scripts/e2eSeedServer.mts의 STATES에
# "admin"이 없다. implementer가 이 task에서 더한다 — 이미 있는
# tests/integration/postgres.ts의 createAdminUser()를 그대로 불러 관리자 사용자를
# 만들고 access_token·refresh_token을 돌려주면 된다. profile은 null이다(관리자는
# 이 화면에서 자기 프로필을 안 본다).
#
# **시드 상태 "blocked"가 지금은 이름 없는 사람을 만든다.** 지금 코드
# (createBlockedUser)는 submit_profile을 거치지 않고 이미 승인된 사용자에
# blocked_at만 SQL로 얹는다 — tests/e2e/blocked.yaml(로그인 직후 튕기는 화면,
# 프로필 값을 안 보임)에는 맞지만, 여기 「차단한 사람」 목록은 이름이 있는
# 줄을 보여줘야 한다. design.md 정본대로면 차단은 「제출됨」 사람만 대상이라
# (이 task의 block_member 규칙), "blocked" 시드가 submit_profile로 이름을 채운
# 뒤 blocked_at을 얹도록(또는 admin이 block_member를 불러) 고쳐야 이 시나리오가
# 실제로 통과한다. 그때까지는 seed-session.js의 output.profileName이 이전
# 장면의 값을 들고 있어 우연히 통과한 것처럼 보일 수 있다 — 진짜 확인이 아니다.
#
# 아래에서 대기자·차단자는 runScript로 "submitted"·"blocked" 상태를 먼저 불러
# DB에 행만 남기고 그 토큰은 버린다(그다음 "admin"을 불러 관리자 토큰으로
# 덮어쓴다). 이름은 시드가 돌려주는 output.profileName을 그대로 쓴다 — 픽스처
# 이름을 글자로 박지 않는다.
#
# 딥링크는 두 단계다. 먼저 __test/session으로 세션을 심고(게이트가 관리자를
# "/"로 보낸다), 그다음 labiebelle://admin/members/pending·blocked로 그 화면에
# 바로 들어간다.
#
# 「승인」을 누른 뒤 시트가 사라지고 그 아래 있었을 줄의 이름이 다시 보이는
# 것을 확인해야 하는데, 시트가 열려 있는 동안은 이름이 줄과 시트 두 곳에
# 동시에 있을 수 있어 애매하다 — 그래서 시트 안에서는 이름을 다시 단언하지
# 않고 시트에만 있는 라벨(성별·생년월일·연락처·구글 계정)로 시트가 뜬 것을
# 확인한다.
#
# 「차단 풀기」는 줄의 버튼과 확인 시트의 오른쪽 버튼이 문안이 똑같다
# (members-pending.md 「차단한 사람 문안」). 확인 시트가 뜬 동안 줄의 버튼이
# 뒤 덮개에 가려 안 보이는지 이 시점엔 확인할 수 없다 — 애매하면 testID로
# 잡으라는 규칙대로, 확인 시트의 오른쪽 버튼에 testID
# "members-pending-unblock-confirm"을 요청한다(이 task 리턴 4번). 그 전까지
# 아래 tapOn은 이 testID를 그대로 쓴다 — src/를 이 파일이 직접 고치지 않는다.
#
# 텍스트 셀렉터는 정규식이다. 아래 문구는 전부 일반 글자라 이스케이프가
# 필요 없다.
appId: com.labiebelle.app
---
# --- 대기자 한 명을 승인한다 ---
- launchApp:
    clearState: true
    clearKeychain: true
- runScript:
    file: scripts/seed-session.js
    env:
      STATE: submitted
- runScript:
    file: scripts/seed-session.js
    env:
      STATE: admin
- openLink: "labiebelle://__test/session?access_token=${output.accessToken}&refresh_token=${output.refreshToken}"
- openLink: "labiebelle://admin/members/pending"

- assertVisible: "가입 대기"
- assertVisible: "${output.profileName}"
- assertVisible: "오늘 보냈어요"

- tapOn: "${output.profileName}"

# 상세 시트 — 줄에는 없는 라벨로 시트가 뜬 것을 확인한다.
- assertVisible: "성별"
- assertVisible: "생년월일"
- assertVisible: "연락처"
- assertVisible: "구글 계정"
- assertVisible: "거절"
- assertVisible: "승인"

- tapOn: "승인"

# 끝난 뒤 — 토스트가 뜨고 줄이 사라진다. 대기자가 하나뿐이라 빈 상태가 선다.
- assertVisible: "${output.profileName} 님을 승인했어요"
- assertVisible: "기다리는 사람이 없어요"

# --- 차단한 사람 한 명의 차단을 푼다 ---
- launchApp:
    clearState: true
    clearKeychain: true
- runScript:
    file: scripts/seed-session.js
    env:
      STATE: blocked
- runScript:
    file: scripts/seed-session.js
    env:
      STATE: admin
- openLink: "labiebelle://__test/session?access_token=${output.accessToken}&refresh_token=${output.refreshToken}"
- openLink: "labiebelle://admin/members/blocked"

- assertVisible: "차단한 사람"
- assertVisible: "${output.profileName}"
- assertVisible: "오늘 차단했어요"

- tapOn: "차단 풀기"

# 확인 시트 — 물음과 버튼 둘. 오른쪽 버튼은 testID로 잡는다(위 머리말 참고).
- assertVisible: "${output.profileName} 님의 차단을 풀까요"
- assertVisible: "다시 로그인할 수 있게 돼요"
- assertVisible: "닫기"
- tapOn:
    id: "members-pending-unblock-confirm"

# 끝난 뒤 — 토스트가 뜨고 줄이 사라진다. 차단한 사람이 하나뿐이라 빈 상태가 선다.
- assertVisible: "${output.profileName} 님의 차단을 풀었어요"
- assertVisible: "차단한 사람이 없어요"
