# 게이트가 프로필을 못 읽으면 /retry가 선다(AC-07).
#
# 이 리스크의 알맹이 — 실패한 읽기를 받았을 때 decide-entry.ts가 /retry를
# 고르는지 — 는 spec이 이미 unit으로 배정했다(기기가 필요 없다). 여기서는
# 그 판정이 실제로 화면과 이어지는지, 화면의 글자와 버튼이 서 있는지만 본다.
#
# **진짜 통신 실패를 못 만든다.** 이 화면에 서려면 세션은 섰는데 `['profile']`
# 읽기가 실패해야 하는데, Maestro에는 기기의 네트워크를 끊는 수단이 없고
# 이 저장소의 시드 서버도 아직 그런 것을 준비하지 않는다. 그래서 시드 상태
# "read_failure"를 하나 더 두고, 시드 서버가 정상 토큰에 `simulate: "read_failure"`를
# 얹어 돌려준다. 테스트 문(`/__test/session`)이 그 값을 받으면 게이트의 프로필
# 읽기를 한 번 실패시킨다 — 개발 빌드에서만 있는 자리다. 이건 실제 네트워크 단절이 아니라
# "읽기가 실패하면 앱이 어떻게 보이는가"에 대한 반응만 확인하는 것이다 —
# strategy.md의 "e2e에서 기기 API를 대역으로 바꾸면 그 조건에 대한 앱 반응만
# 검증한다"와 같은 한계다.
#
# 그래서 「다시 시도」는 누르지 않는다. 눌러도 같은 가짜 실패 토큰이 다시
# 쓰이면 무엇을 확인한 것인지가 흐려진다 — 화면 문구와 버튼이 서 있는지만
# 본다.
#
# 문안은 docs/2-design/modules/account/screens/login.md 「읽기 실패 문안」
# 표 글자 그대로다.
appId: com.labiebelle.app
---
- launchApp:
    clearState: true
    clearKeychain: true
- runScript:
    file: scripts/seed-session.js
    env:
      STATE: read_failure
- openLink: "labiebelle://__test/session?access_token=${output.accessToken}&refresh_token=${output.refreshToken}&simulate=${output.simulate}"
- assertVisible: "불러오지 못했어요"
- assertVisible: "연결을 확인하고 다시 시도해 주세요"
- assertVisible: "다시 시도"
- assertVisible: "로그아웃"
