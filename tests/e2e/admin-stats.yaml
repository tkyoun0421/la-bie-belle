# `tests/e2e/scripts/seedSession.js`는 이 task가 이미 고쳤다(위 SchedulePayload
# 세 필드를 escapeForTextSelector로 감싸 내보내는 블록과 STATE 주석 목록 갱신).
#
# ## 이 task가 요청하는 testID 넷
#
# - `stats-month-prev`·`stats-month-next` — 달 줄의 좌우 화살표. 아이콘만 있고
#   글자가 없어(schedule-month-prev·next와 같은 이유) 텍스트로 못 잡고, 이
#   화면은 "?month="이 없어 화살표를 실제로 여러 번 눌러야만 과거 달에 닿는다 —
#   그래서 다른 화면보다 더 이 testID에 기댄다. **화살표가 사라졌는지도 이
#   id로 본다** — "못 가는 화살표는 안 그리고 자리만 남긴다"(stats.md)이므로
#   `assertNotVisible: {id: ...}`가 그 부재를 확인하는 유일한 손잡이다.
# - `stats-trend-chart` — 추이 그래프 전체 영역. 점·선·면에 글자가 없어 "그래프를
#   눌러도 달이 안 바뀐다"를 확인하려면 탭할 손잡이가 이것뿐이다. 손짓
#   테스트(components.md 「집기」)의 조각들과 달리 이 그래프는 지금까지 이
#   화면에서 처음 서는 조각이라 testID가 아예 없다.
# - `stats-attendance-legend-<몫>` — 근태 탭 범례의 칸 하나(비율 띠 아래).
#   `RatioBand`가 몫마다 `${testID}-legend-${key}`를 글자에 실어 준다(띠 쪽
#   `${testID}-share-${key}`와 같은 꼴). 그 위 현황 줄("출근 n · 지각 n · 출근
#   인정 n · 결근 n")에 같은 낱말과 숫자가 이미 서 있어, 컨테이너 id에 글자만
#   맞추면 범례가 안 그려져도 현황 줄이 대신 통과시킨다. 몫이 0인 달에
#   `assertNotVisible`로 그 칸의 부재를 보는 것도 이 id라야 된다.
#
# **`repeat` 커맨드를 한 번도 못 돌려봤다.** Maestro 문서상 `repeat: {times, commands}`
# 문법인데, 이 저장소의 다른 플로우는 아직 안 쓴다 — CLI로 실제 파싱되는지 확인한
# 적이 없다. 안 되면 `tapOn`을 그 수만큼 풀어 쓰는 것으로 바꾼다.
#
# 텍스트 셀렉터는 정규식이다. "·"는 정규식에서 뜻이 있는 글자가 아니라 그대로
# 쓴다. "–"(엔대시)도 마찬가지다.
#
# ## 손계산 표
#
# ### statsWorkMonth(오프셋 -3) — 근무 탭 주 데이터
#
# | 사람 | 날 | 포지션(앞 포지션) | 시간 | 근태 |
# | --- | --- | --- | --- | --- |
# | 고은채 | 1일 | 메인(드레스와 겸임) | 9시간(10:00–19:00) | 출근(09:58 체크인) |
# | 강태오 | 2일 | 안내(교육) | 6시간(10:00–16:00) | 지각(10:15 체크인, 10분 초과) |
# | 윤소현 | 3일 | 스캔 | 8시간(10:00–18:00) | 결근(체크인·사유 없음) |
# | 민하율 | 4일 | 매니저 | 7시간(10:00–17:00) | 출근 인정(승인된 사유) |
#
# - 합계: **30시간**, 근무 **4건**
# - 사람별: 고은채 9시간·1회 > 윤소현 8시간·1회 > 민하율 7시간·1회 > 강태오
#   6시간·1회 (겹치는 시간 값이 없어 순서 무관하게 이름+시간 조합으로 특정된다)
# - 포지션: 메인 9시간·1건, 스캔 8시간·1건, 매니저 7시간·1건, 안내 6시간·1건.
#   나머지 다섯(팀장·드레스·축가·드레스실·대기실)은 0시간 — "드레스"가 0인
#   것이 겸임을 양쪽에 안 얹었다는 증거이지만, 정확한 "0시간" 표기 확인은
#   이 파일이 안 한다(아래 「뺀 단언」)
# - 근태 현황: 출근 1·지각 1·출근 인정 1·결근 1 — 범례 **"출근 1 · 인정 1 · 지각 1 · 결근 1"**
#   (넷 다 0이 아니라 아무것도 안 빠진다)
# - 고은채 시트: 손잡이·이름·날짜 목록 한 줄(1일·메인·9시간)·합계 줄 **"합계 · 1회 · 9시간"**
#
# ### statsSecondMonth(오프셋 -4) — 두 몫이 0인 달
#
# | 사람 | 날 | 포지션 | 시간 | 근태 |
# | --- | --- | --- | --- | --- |
# | 고은채 | 1일 | 메인 | 8시간(10:00–18:00) | 출근(09:55 체크인) |
# | 강태오 | 2일 | 스캔 | 8시간(10:00–18:00) | 출근(09:50 체크인) |
# | 강태오 | 3일 | 스캔 | 9시간(10:00–19:00) | 지각(10:15 체크인) |
#
# - 합계: **25시간**, 근무 **3건**
# - 사람별: 고은채 8시간·1회, 강태오 17시간(8+9)·2회
# - 포지션: 메인 8시간·1건, 스캔 17시간·2건
# - 근태 현황: 출근 2·지각 1·출근 인정 0·결근 0 — 범례 **"출근 2 · 지각 1"**
#   (출근 인정·결근 둘 다 몫이 0이라 빠진다)
#
# ### statsEmptyMonth(오프셋 -5) — 근무가 하나도 없는 달
#
# `schedules` 행만 있고 `days`가 없다. 세 달 중 가장 이르므로 뒤로 가는 화살표가
# 여기서 사라진다. 합계 자리 "–", 구획 머리글(사람별·포지션) 없음, 목록 자리에
# 빈 상태 제목·아래 줄, 추이 그래프는 그대로 선다(그 달만 점이 빠진 채).
appId: com.labiebelle.app
---
- launchApp:
    clearState: true
    clearKeychain: true
- runScript:
    file: scripts/seed-session.js
    env:
      STATE: stats_admin_overview
- openLink: "labiebelle://__test/session?access_token=${output.accessToken}&refresh_token=${output.refreshToken}"
- openLink: "labiebelle://admin/stats"

# ================================================================
# 랜딩(이번 달) — 짜임과 이번 달의 화살표 경계
# ================================================================
- assertVisible: "통계"
- assertVisible: ".*[0-9]{4}년 [0-9]+월.*"
- assertVisible: "근무"
- assertVisible: "근태"
- assertVisible:
    id: "stats-trend-chart"

# 이번 달이라 앞으로 갈 화살표가 없다 — 자리만 남고 안 그린다(stats.md).
- assertNotVisible:
    id: "stats-month-next"

# --- 한 달 물러나면 앞 화살표가 다시 선다 ---
- tapOn:
    id: "stats-month-prev"
- assertVisible:
    id: "stats-month-next"

# ================================================================
# statsWorkMonth — 근무 탭: 합계·보조 줄·사람별 구획·포지션 구획
# ================================================================
- repeat:
    times: 2
    commands:
      - tapOn:
          id: "stats-month-prev"
- assertVisible: "${output.statsWorkMonthLabel}"

# --- 그래프를 눌러도 달이 안 바뀐다 ---
- tapOn:
    id: "stats-trend-chart"
- assertVisible: "${output.statsWorkMonthLabel}"

- tapOn: "근무"
- assertVisible: "30시간"
- assertVisible: "근무 4건"

# --- 사람별 구획 — 값이 화면에 도착하는지만 본다(합이 맞는지는 unit이 본다) ---
- assertVisible: "사람별"
- assertVisible: "고은채"
- assertVisible: "9시간"
- assertVisible: "윤소현"
- assertVisible: "8시간"
- assertVisible: "민하율"
- assertVisible: "7시간"
- assertVisible: "강태오"
- assertVisible: "6시간"

# --- 포지션 구획 — 아홉이 다 서고 0시간 포지션("대기실")도 행으로 남는다 ---
- assertVisible: "포지션"
- assertVisible: "메인"
- assertVisible: "스캔"
- assertVisible: "매니저"
- assertVisible: "안내"
- assertVisible: "대기실"

# --- 포지션 줄은 안 눌린다 — 눌러도 근무 내역 시트가 안 열린다 ---
- tapOn: "대기실"
- assertNotVisible: "합계 · "

# --- 사람별 줄 → 근무 내역 시트 → 합계가 구획 줄의 값과 같다 ---
# 겸임인 날은 앞 포지션("메인")만 낸다(stats.md·spec AC-02 — 위 머리말의 「겸임
# 시트 표기」 참고, 포지션 둘을 동시에 보이는 단언은 정본과 어긋나 안 쓴다).
- tapOn: "고은채"
- assertVisible: "고은채"
- assertVisible: "메인"
- assertVisible: "합계 · 1회 · 9시간"
- back

# ================================================================
# statsWorkMonth — 근태 탭: 달 유지, 현황 줄, 비율 띠와 범례(넷 다 0이 아니다)
# ================================================================
- tapOn: "근태"
- assertVisible: "${output.statsWorkMonthLabel}"
- assertVisible: "출근 1"
- assertVisible: "지각 1"
- assertVisible: "출근 인정 1"
- assertVisible: "결근 1"

# 범례는 몫마다 "라벨 값" 한 칸이 제 id로 선다 — "·" 이음표는 현황 줄에만
# 있고 범례엔 없다(RatioBand.tsx의 legend map). 칸마다 id가 있어 위 현황
# 줄의 같은 글자가 대신 통과시키지 못한다. 넷 다 몫이 있어 넷 다 선다.
- assertVisible:
    id: "stats-attendance-legend-present"
    text: "출근 1"
- assertVisible:
    id: "stats-attendance-legend-excused"
    text: "인정 1"
- assertVisible:
    id: "stats-attendance-legend-late"
    text: "지각 1"
- assertVisible:
    id: "stats-attendance-legend-absent"
    text: "결근 1"

# --- 근태 줄은 안 눌린다 ---
- tapOn: "강태오"
- assertNotVisible: "합계 · "

# ================================================================
# statsSecondMonth — 근태 탭 유지한 채 한 달 더 물러난다. 결근·출근 인정 두
# 몫이 0이라 범례에서 빠진다.
# ================================================================
- tapOn:
    id: "stats-month-prev"
- assertVisible: "${output.statsSecondMonthLabel}"
- assertVisible: "출근 2"
- assertVisible: "지각 1"

# 결근·출근 인정 두 몫이 0이라 범례에서 아예 빠진다(entry.share.value > 0
# 필터, RatioBand.tsx) — 남은 둘만 칸으로 선다. 없어진 둘은 id로 짚어
# 부재를 단언한다: 글자로 보면 위 현황 줄의 "결근 0"이 걸릴 수 있다.
- assertVisible:
    id: "stats-attendance-legend-present"
    text: "출근 2"
- assertVisible:
    id: "stats-attendance-legend-late"
    text: "지각 1"
- assertNotVisible:
    id: "stats-attendance-legend-excused"
- assertNotVisible:
    id: "stats-attendance-legend-absent"

# --- 같은 달, 근무 탭으로 돌아가 총계가 달라졌는지 본다(달마다 따로 읽는다) ---
- tapOn: "근무"
- assertVisible: "25시간"
- assertVisible: "근무 3건"
- assertVisible: "고은채"
- assertVisible: "8시간"
- assertVisible: "강태오"
- assertVisible: "17시간"

# ================================================================
# statsEmptyMonth — 근무가 하나도 없는 달.
# ================================================================
# 뒤로 가는 화살표가 여기서 사라지는지는 안 잰다. 바닥은 `getFirstScheduleMonth`가
# 내는 전역 값이라 역할과 무관하고, 다른 상태가 더 이른 달을 심으면 이 단언이 그대로
# 깨진다(stats_worker_overview가 오프셋 -6을 쓴다). 그 바닥 로직은
# src/shared/lib/__tests__/monthBoundary.test.ts의 canGoBack이
# unit으로 이미 진다.
- tapOn:
    id: "stats-month-prev"
- assertVisible: "${output.statsEmptyMonthLabel}"

- assertVisible: "–"
- assertVisible: "이 달은 아직 근무표가 없어요"
- assertVisible: "근무를 넣으면 여기 숫자가 서요"
- assertNotVisible: "사람별"
- assertNotVisible: "포지션"
# 추이 그래프는 안 빈다 — 다른 달의 값이 그대로 있다.
- assertVisible:
    id: "stats-trend-chart"

# --- 근태 탭도 같은 모양으로 빈다 ---
- tapOn: "근태"
- assertVisible: "이 달은 아직 근무표가 없어요"
- assertVisible: "근무를 넣으면 여기 숫자가 서요"

# --- 그래프를 눌러도 달이 안 바뀐다(빈 달에서도 같다) ---
- tapOn:
    id: "stats-trend-chart"
- assertVisible: "${output.statsEmptyMonthLabel}"
