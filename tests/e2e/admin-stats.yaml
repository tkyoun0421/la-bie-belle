# 관리자 통계 — 관리자가 근무 탭에서 이번 달 합계·사람별·포지션 구획을 보고, 사람별
# 줄을 눌러 근무 내역 시트를 확인하고, 포지션 줄은 안 눌리는 것을 보고, 근태 탭으로
# 건너가 달이 유지되는 채로 현황·비율 띠·범례를 보고, 달을 앞뒤로 옮기며 화살표
# 경계와 빈 상태(근무가 하나도 없는 달)를 겪는 것까지 한 여정으로 간다.
#
# 근거는 docs/2-design/spec/stats-admin.md(AC-02·AC-04·AC-05, 상태 격자 「빈
# 상태」·「경계」)와 docs/3-build/plans/stats-admin.md(AC-06~AC-09, 「착수 판정」)와
# docs/2-design/system/screens/stats.md(「관리자 — /admin/stats」·「짜임과 토큰」·
# 「문안」)다. 배정받은 리스크는(총괄 지시 「쓸 것 — 한 여정」)
#   - 앱바·달 줄·세그먼트·추이 그래프까지의 짜임
#   - 근무 탭 — 합계·보조 줄·사람별 구획·포지션 구획에 값이 실제로 도착한다(셋의
#     합이 같은 것은 unit이 이미 본다 — work-totals.test.ts)
#   - 사람별 줄 → 근무 내역 시트 → 합계가 구획 줄과 같다
#   - 포지션 줄은 안 눌린다(화살표가 없다)
#   - 근태 탭 — 달이 유지된 채로 현황 줄·비율 띠·범례. 몫이 0인 갈래는 범례에서
#     빠진다
#   - 달 앞뒤 이동 — 이번 달에서 앞 화살표가 사라지고 첫 근무표가 있는 달에서 뒤
#     화살표가 사라진다
#   - 그래프를 눌러도 달이 안 바뀐다
#   - 근무가 없는 달 — 합계 `–`, 목록 자리에 빈 상태, 그래프는 안 빈다
# AC-01(사람별 합·포지션 합·전체가 같은지, 겸임·교육·리허설 처리)과 AC-03(열두 달
# 추이의 계산)은 test-planner가 이미 unit으로 배정했다(work-totals.test.ts·
# trend.test.ts) — 여기서는 그 계산이 실제 화면에 도착하는지, 탭과 달 이동이 실제로
# 이어지는지만 본다. AC-07(근무자 리다이렉트)은 안 쓴다 — `/admin` 아래를 지키는
# `_layout.tsx` 가드는 tests/e2e/admin.yaml이 대표로 이미 본다(plan 「착수 판정」의
# 같은 판정).
#
# **겸임 시트 표기에 관해 정본과 배정이 갈린다.** 배정 지시문은 "겸임인 날에
# 포지션 둘이 뜬다"고 적었지만, docs/2-design/system/screens/stats.md 「근무 내역
# 시트」는 "겸임인 날은 앞 포지션만 적는다 — 포지션 구획이 세는 방식과 같다. 두
# 포지션을 다 적으면 시간이 두 번 든 것처럼 읽힌다"고 명시하고,
# docs/2-design/spec/stats-admin.md AC-02도 "겸임인 날은 앞 포지션만 낸다 — 구획과
# 같은 규칙이라 두 값이 맞는다"고 같은 말을 한다. 이 파일은 **정본(두 문서가 일치하는
# 쪽)을 따라 앞 포지션 하나만 뜨는 것으로 적는다** — 배정 지시문 쪽 문구가 오기이거나
# 다른 화면(예: 근무표 날 상세의 겸임 배지 "메인·드레스")과 혼동됐을 가능성을 아래
# 「발견한 이슈」에 적어 돌려준다. 구현이 실제로 포지션 둘을 낸다면 그것은 이 정본과
# 어긋나는 것이라 이 플로우가 그 쪽으로 잡히면 안 된다.
#
# 세션은 개발 빌드의 테스트 문과 시드 서버로 심는다 — 계약은
# tests/e2e/schedule-worker.yaml 머리말, scripts/e2eSeedServer.mts,
# scripts/seed-session.js를 따른다. 딥링크는 navigation.md 「경로」의 "/admin/stats"
# 그대로다.
#
# **`/admin/stats`는 "?month="을 안 받는다.** navigation.md 「경로」 표의
# "/admin/schedule"·"/me/rehearsals" 행은 "?month="를 명시로 적지만
# "/admin/stats" 행에는 그 언급이 없다 — stats-admin plan의 AC-06 화면 뼈대
# 절에도 쿼리 파라미터가 없고, 상태 격자 「재진입」이 "다시 들어오면 이번 달로
# 돌아간다 — 보던 달을 기억하지 않는다"고 정한 것과도 맞는다. **그래서 이 화면은
# 딥링크로 바로 어느 달에 못 간다** — 항상 실제 오늘이 든 달("이번 달")로 열리고,
# 다른 달을 보려면 화면 안에서 달 화살표를 눌러야 한다. 아래 시드가 만드는 세 달
# 전부 이 방식(화살표 반복)으로만 닿는다.
#
# **시드 서버에 상태 "stats_admin_overview"가 아직 없다 — implementer가 이 task에서
# 더한다.** 관리자 하나와 근무자 넷, 그리고 진짜 과거 세 달(오프셋 -3·-4·-5)을
# 세운다. `create_schedule`·`open_day`는 지난 날짜를 거절해서(`date_past`) 이
# 화면처럼 과거 달을 보여줘야 하는 시드는 `seedPastSchedule`·`seedPastDay`(직접
# SQL, tests/e2e/payroll.yaml의 `seedPayrollView`와 같은 손)로 심는다.
# `seedPastSchedule`이 `confirmed_at`을 안 채우는데, 이 화면은 확정 여부를 안 보므로
# (plan 「착수 판정」 — "배정이 있으면 센다") 그대로 써도 된다.
#
# **왜 오프셋 -3·-4·-5인가.** 이번 달(0)은 `rehearsal_qualified`가, -1과 -2는
# `payroll_view`/`payroll_view_left`가 이미 건드린다(-2는 `secondMonthOffset`이
# 지난달이 1월이 아닌 한 고르는 값이다) — `pnpm e2e`가 `tests/e2e/` 전체를 한
# 로컬 DB 위에서 돈다면(execution.md 「pnpm e2e」, 리셋 시점은 문서에 없다) 그 두
# 상태와 겹치지 않을 달이 필요하다. -3·-4·-5는 그 넷과 안 겹치는 가장 가까운
# 구간이라는 추정이고, **이후에 다른 task가 같은 구간의 과거 달을 쓰면 다시
# 부딪힐 수 있는 임시방편이다** — 아래 「이슈」에도 적는다. 세 달이 화살표
# 반복(최대 5번)으로 닿을 만큼 가까운 것과, `payroll_view`류를 피하는 것 사이의
# 타협이다.
