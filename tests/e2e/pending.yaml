# /pending이 세 장면을 다 든다 — 프로필 작성, 축하, 승인 대기, 거절된 뒤
# 재진입. 화면이 하나라 플로우도 하나고, 장면마다 앱을 다시 깨끗이 켠다.
#
# 세션은 개발 빌드의 테스트 문(src/app/__test/session.tsx — 아직 없다)과 시드
# 서버(scripts/e2e-seed-server.mts, 127.0.0.1:8765 — 아직 없다)로 심는다.
# runScript(tests/e2e/scripts/seed-session.js)가 시드 서버를 부르고 받은 토큰을
# openLink에 싣는다. 계약 표는 이 task 리턴에 있다.
#
# 문안은 docs/2-design/modules/account/screens/login.md의 문안 표 글자 그대로다.
#
# AC-01 — 로그인만 하고 한 번도 안 보낸 사람이 다섯 칸을 채워 보내면 축하를
# 지나 승인 대기가 선다.
#
# AC-03(사진을 바꿔 고른다)은 여기서 못 다룬다. 기기의 사진 고르기는 OS
# 피커라 Maestro가 그 안까지 못 들어간다 — 원을 눌러 피커가 뜨는 것까지는
# 볼 수 있어도 사진을 골라 돌려주는 동작은 자동화 밖이다. 그래서 사진 스텝은
# 항상 「기본 사진 쓰기」로 넘긴다.
#
# AC-04 — 거절당한 사람이 다시 열면 승인 대기가 거절 문구를 보이고,
# 「다시 보내기」로 들어가면 지난 값 다섯이 굳은 채 서 있다. 고쳐서 다시
# 보내면 축하 화면 없이 바로 승인 대기다.
#
# AC-05 — 이미 보내고 판정을 기다리는 사람은 앱을 열면 바로 승인 대기다.
#
# 텍스트 셀렉터는 정규식이라 물음표처럼 정규식에서 뜻이 있는 글자는
# 이스케이프한다.
appId: com.labiebelle.app
---
# --- AC-01: 처음 보내는 사람 ---
- launchApp:
    clearState: true
    clearKeychain: true
- runScript:
    file: scripts/seed-session.js
    env:
      STATE: fresh
- openLink: "labiebelle://__test/session?access_token=${output.accessToken}&refresh_token=${output.refreshToken}"
- assertVisible: "자신의 프로필을 작성해 주세요"

# 사진 — 기본 사진을 그대로 쓴다.
- tapOn: "기본 사진 쓰기"

# 이름 — 키보드의 완료가 굳는 계기다.
- tapOn: "근무표에 뜰 이름"
- inputText: "김도윤"
- pressKey: Enter

# 성별 — 누르는 순간 굳는다.
- tapOn: "여"

# 생년월일 — 여덟 자리가 실존 날짜가 되는 순간 굳는다.
- tapOn: "19930421"
- inputText: "19930421"

# 연락처 — 010으로 시작하는 11자리가 되는 순간 굳는다.
- tapOn: "010-0000-0000"
- inputText: "01000000001"

- assertVisible: "보내기"
- tapOn: "보내기"

# 보낸 뒤 — 폭죽 축하를 지나 승인 대기로 넘어간다.
- assertVisible: "김도윤님, 반가워요"
- assertVisible: "관리자가 확인 중이에요"

# --- AC-04: 거절당한 뒤 다시 보내는 사람 ---
- launchApp:
    clearState: true
    clearKeychain: true
- runScript:
    file: scripts/seed-session.js
    env:
      STATE: rejected
- openLink: "labiebelle://__test/session?access_token=${output.accessToken}&refresh_token=${output.refreshToken}"

# 승인 대기가 거절된 뒤의 모습으로 선다 — 점 없는 배지, 다른 제목, 버튼 둘.
- assertVisible: "아직 연결 전"
- assertVisible: "이번엔 연결이 안 됐어요"
- assertVisible: "프로필을 고쳐서 다시 보낼 수 있어요"
- tapOn: "다시 보내기"

# 프로필 작성이 지난 값 다섯을 굳은 채로 보여준다.
- assertVisible: "아래 정보가 맞나요\\? 틀린 부분을 누르면 다시 적을 수 있어요"
- assertVisible: "박서연님, 반가워요"
- assertVisible: "남성"
- assertVisible: "1990년 11월 5일"
- assertVisible: "010-0000-0002"
- assertVisible: "이름과 성별과 생년월일은 보내고 나면 못 고쳐요"

- tapOn: "보내기"

# 거절 뒤 재전송은 축하 없이 바로 승인 대기다.
- assertVisible: "관리자가 확인 중이에요"

# --- AC-05: 이미 보내고 기다리는 사람 ---
- launchApp:
    clearState: true
    clearKeychain: true
- runScript:
    file: scripts/seed-session.js
    env:
      STATE: submitted
- openLink: "labiebelle://__test/session?access_token=${output.accessToken}&refresh_token=${output.refreshToken}"
- assertVisible: "승인 기다리는 중"
- assertVisible: "관리자가 확인 중이에요"
