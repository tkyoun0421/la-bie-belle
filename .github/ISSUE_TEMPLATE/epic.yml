name: Epic
description: 기능 하나, 또는 여러 단계로 쪼개지는 총괄 작업. PM 또는 총괄이 발행한다.
title: "[Epic] "
body:
  - type: markdown
    attributes:
      value: |
        이 본문은 사람이 읽는 보고서다. 여기만 읽고도 무슨 작업이 벌어지는지 알 수 있어야 한다.
        기능이라면 정확한 명세는 `docs/specs/` 파일에 있다. 그 상세를 여기에 복사하지 않는다.
  - type: textarea
    id: what
    attributes:
      label: 무엇을 만드나
      description: 한 문단. 지금은 어떻게 되어 있고, 이 작업이 끝나면 무엇이 가능해지는지.
      placeholder: |
        예약한 손님이 방문 전에 스스로 예약을 취소할 수 있게 한다.
        지금은 취소하려면 가게에 전화해야 하고, 그 통화가 영업시간에만 된다.
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: 무엇이 달라지나
      description: 겉으로 드러나는 변화를 항목으로. 기능이면 사용자가 보는 것, 총괄 작업이면 흐름에서 달라지는 것.
      placeholder: |
        - 예약 내역 화면에 "예약 취소" 버튼이 생긴다
        - 취소하면 그 자리가 즉시 다시 예약 가능해진다
        - 방문 24시간 안쪽이면 취소가 막히고 가게 연락처가 대신 뜬다
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: 이번에 하지 않는 것
      description: 범위 밖으로 밀어 둔 것. 적어 두지 않으면 나중에 빠뜨린 것으로 읽힌다.
      placeholder: 환불 처리, 취소 사유 수집, 가게 쪽 취소 알림.
  - type: input
    id: spec
    attributes:
      label: 상세 명세
      description: 저장소 안 경로. 명세 파일이 없는 총괄 작업이면 비워 둔다.
      placeholder: docs/specs/reservation-cancel.md
  - type: dropdown
    id: owner
    attributes:
      label: 담당
      description: Epic은 경로가 없어 소유 registry가 담당을 정하지 못한다. 여기서 고른다.
      options:
        - PM
        - Dev
        - UI
        - 총괄
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: 닫히는 시점
      description: 비워 두면 "달린 슬라이스가 전부 닫히면"으로 읽는다.
  - type: dropdown
    id: type
    attributes:
      label: type
      options:
        - type:feature
        - type:bug
        - type:refactor
        - type:docs
        - type:chore
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: surface
      options:
        - surface:ui
        - surface:db
        - surface:auth
        - surface:api
        - surface:workflow
        - surface:docs
    validations:
      required: true
  - type: dropdown
    id: risk
    attributes:
      label: risk
      description: 해당하는 것이 없으면 비워 둔다. 여럿이면 여러 개 고른다.
      multiple: true
      options:
        - risk:security
        - risk:privacy
        - risk:performance
        - risk:concurrency
        - risk:migration
        - risk:external
  - type: markdown
    attributes:
      value: |
        고른 세 축은 본문에 기록될 뿐 라벨로 자동 부착되지 않는다. 발행한 뒤 같은 값으로 라벨을 단다.
