name: Ticket
description: 리뷰 normal 후속, 개선, 부채. 총괄이 발행한다.
title: "[Ticket] "
body:
  - type: markdown
    attributes:
      value: |
        이 본문은 사람이 읽는 보고서다. 무슨 일인지 사람 말로 먼저 쓰고, 파일과 줄 번호는 아래 `출처`에 적는다.
  - type: textarea
    id: todo
    attributes:
      label: 무엇을 할 것인가
      description: 무엇을 어떻게 바꾸면 닫히는지.
      placeholder: |
        interview 스킬이 이미 받은 검색 결과를 다시 찾지 않도록 단서를 붙인다.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: 왜
      description: 이대로 두면 무엇이 나빠지는지. 사람 말로.
      placeholder: |
        문서를 쓸 때마다 같은 파일을 두 번 뒤진다.
        문서 하나 쓰는 데 드는 시간과 토큰이 그만큼 늘어난다.
    validations:
      required: true
  - type: input
    id: path
    attributes:
      label: 어디를 건드리나
      placeholder: .claude/skills/interview/SKILL.md
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        담당은 고르지 않는다. 위 `어디를 건드리나`에 적은 경로를 `config/ownership.json`에 대면 소유 role이 나온다. 네 목록 어디에도 없으면 담당이 아니라 registry의 구멍이다. 그 경로를 어느 키에 넣을지 정하는 것이 먼저인데, 그 registry 자체가 총괄 소유라 `[Request]`로 갈 자리가 없다. `config/ownership.json`에 경로를 넣는 `[Ticket]`을 총괄이 열고, 그 PR이 merge된 뒤에 본래 일이 이어진다.
  - type: textarea
    id: source
    attributes:
      label: 출처
      description: 어디서 나온 항목인지. 리뷰 발견이면 그 PR과 지적 내용, 근거가 되는 파일과 줄 번호.
      placeholder: |
        PR #76 리뷰의 normal 지적
        `.claude/skills/interview/SKILL.md:22`
  - type: dropdown
    id: type
    attributes:
      label: type
      options:
        - type:feature
        - type:bug
        - type:refactor
        - type:docs
        - type:chore
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: surface
      options:
        - surface:ui
        - surface:db
        - surface:auth
        - surface:api
        - surface:workflow
        - surface:docs
    validations:
      required: true
  - type: dropdown
    id: risk
    attributes:
      label: risk
      description: 해당하는 것이 없으면 비워 둔다. 여럿이면 여러 개 고른다.
      multiple: true
      options:
        - risk:security
        - risk:privacy
        - risk:performance
        - risk:concurrency
        - risk:migration
        - risk:external
  - type: markdown
    attributes:
      value: |
        고른 세 축은 본문에 기록될 뿐 라벨로 자동 부착되지 않는다. 발행한 뒤 같은 값으로 라벨을 단다.
