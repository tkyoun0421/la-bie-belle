name: Slice (디자인)
description: docs/ui/ 스펙을 이미 구현된 화면에 적용한다. Dev가 발행한다.
title: "[Slice] "
labels: ["surface:ui"]
body:
  - type: markdown
    attributes:
      value: |
        기능 구현이 먼저다. 디자인은 `docs/ui/<화면>.md`가 나온 뒤 별도 슬라이스로 적용한다.

        무엇을 어떻게 그리는지의 정본은 그 UI 스펙 파일이다. 여기에는 눈에 보이는 변화와 확인 절차만 적는다.
  - type: input
    id: screen
    attributes:
      label: 대상 화면
      placeholder: 예약 내역
    validations:
      required: true
  - type: input
    id: ui-spec
    attributes:
      label: UI 스펙
      description: 저장소 안 경로.
      placeholder: docs/ui/reservation-list.md
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: 무엇이 달라 보이나
      description: 적용 전과 후의 차이. 값으로 적는다.
      placeholder: |
        카드 간격이 16px에서 24px로 벌어지고, 취소 버튼이 secondary에서
        destructive 색으로 바뀐다. 취소됨 상태 배지가 새로 생긴다.
    validations:
      required: true
  - type: textarea
    id: verify
    attributes:
      label: 확인 방법
      description: 상태·반응형·접근성까지 직접 확인하는 순서.
      value: |
        - [ ]
        - [ ]
    validations:
      required: true
  - type: input
    id: feature-slice
    attributes:
      label: 관련 기능 슬라이스
      description: 이 화면을 만든 슬라이스. 없으면 비워 둔다.
      placeholder: "#83"
  - type: dropdown
    id: type
    attributes:
      label: type
      options:
        - type:feature
        - type:refactor
        - type:chore
    validations:
      required: true
  - type: dropdown
    id: risk
    attributes:
      label: risk
      description: 해당하는 것이 없으면 비워 둔다. 여럿이면 여러 개 고른다.
      multiple: true
      options:
        - risk:security
        - risk:privacy
        - risk:performance
        - risk:concurrency
        - risk:migration
        - risk:external
  - type: markdown
    attributes:
      value: |
        `surface:ui`는 자동으로 붙는다. type과 risk는 본문에 기록될 뿐이니 발행한 뒤 직접 단다.
