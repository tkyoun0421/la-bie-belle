name: Request
description: 자기 소유 밖 경로의 변경 요청. 아무 role이나 발행한다.
title: "[Request] "
body:
  - type: markdown
    attributes:
      value: |
        소유 role이 스스로 판단한다 — 받아들여 구현하고 PR을 열거나, 사유를 코멘트로 남기고 닫는다. 총괄은 role끼리 의견이 갈릴 때만 중재한다.

        받는 쪽이 이 본문만 읽고 판단할 수 있어야 한다.
  - type: textarea
    id: what
    attributes:
      label: 무엇을 바꿔 달라
      placeholder: |
        예약 취소 스펙의 인수 조건 3번이 취소가 막혔을 때 화면에 뜨는 문장을 정하지 않았다.
        그 문장을 스펙에 적어 달라.
    validations:
      required: true
  - type: input
    id: path
    attributes:
      label: 어디
      placeholder: docs/specs/reservation-cancel.md
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: 이게 없으면 무엇이 막히나
      description: 막힌 작업이 있으면 그 Issue를 링크한다.
      placeholder: |
        예약 취소 화면의 UI 명세를 쓰려는데 사용자가 볼 문장의 정본이 없다.
        지금 상태로는 UI가 문구를 지어내고, 나중에 스펙과 갈린다.
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        담당은 고르지 않는다. 위 `어디`에 적은 경로를 `config/ownership.json`에 대면 소유 role이 나온다. pm·dev·ui 목록 어디에도 없으면 총괄이다.
  - type: input
    id: related
    attributes:
      label: 관련
      description: 이 요청을 낳은 Issue나 PR. 없으면 비워 둔다.
      placeholder: "#70"
  - type: dropdown
    id: type
    attributes:
      label: type
      options:
        - type:feature
        - type:bug
        - type:refactor
        - type:docs
        - type:chore
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: surface
      options:
        - surface:ui
        - surface:db
        - surface:auth
        - surface:api
        - surface:workflow
        - surface:docs
    validations:
      required: true
  - type: dropdown
    id: risk
    attributes:
      label: risk
      description: 해당하는 것이 없으면 비워 둔다. 여럿이면 여러 개 고른다.
      multiple: true
      options:
        - risk:security
        - risk:privacy
        - risk:performance
        - risk:concurrency
        - risk:migration
        - risk:external
  - type: markdown
    attributes:
      value: |
        고른 세 축은 본문에 기록될 뿐 라벨로 자동 부착되지 않는다. 발행한 뒤 같은 값으로 라벨을 단다.
