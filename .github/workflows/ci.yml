name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: 문서만 바뀐 PR인지 본다
        id: scope
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "${{ github.event.pull_request.base.sha }}...HEAD")
          if printf '%s\n' "$changed" | grep -qvE '^(docs/|\.claude/|[^/]+\.md$)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "문서만 바뀌었다. DB와 브라우저를 쓰는 단계를 건너뛴다."
          fi
      - uses: pnpm/action-setup@v6
        with:
          version: 8.15.2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - name: 번들이 만들어지는지 본다
        if: steps.scope.outputs.code == 'true'
        run: pnpm bundle
      - name: 추적 중인 spec·plan의 입력이 바뀌면 PR 본문의 영향 확인 절을 본다
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          git diff --name-only "${{ github.event.pull_request.base.sha }}...HEAD" \
            | node --experimental-strip-types scripts/check-sources-impact.mts
      - uses: supabase/setup-cli@v1
        if: steps.scope.outputs.code == 'true'
        with:
          version: 2.75.0
      - name: 테스트가 쓰는 서비스만 띄운다
        if: steps.scope.outputs.code == 'true'
        # storage-api 가 목록에서 빠진 것은 avatars 버킷 테스트가 그 서비스에 붙기 때문이다.
        run: supabase start -x realtime,imgproxy,mailpit,postgres-meta,studio,edge-runtime
      - run: pnpm test:integration:run
        if: steps.scope.outputs.code == 'true'
      # 마이그레이션은 위 단계가 올렸다. 그 뒤의 DB에서 다시 뽑아 커밋된 것과 같은지 본다 —
      # 표를 바꾸고 `pnpm types`를 안 돌린 PR이 여기서 걸린다.
      - name: 생성 타입이 마이그레이션과 같은지 본다
        if: steps.scope.outputs.code == 'true'
        run: |
          pnpm types
          git diff --exit-code -- src/shared/api/database-types.ts
      # e2e가 여기 있었다. 웹을 걷으면서 같이 빠졌다 — 러너를 고르고 나서 선다(`e2e-runner`).
      # 네이티브 컴파일은 EAS 설정과 같이 온다. 위 `pnpm bundle`은 그 앞 단계인
      # JavaScript 번들만 본다 — 검증 넷이 다 초록인데 Metro가 못 묶는 일이 있었다.

  # 로컬 pre-commit 훅은 opt-in이라 우회 가능하다. CI에서 결정적으로 한 번 더 막는다.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
