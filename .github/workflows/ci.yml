name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          version: 8.15.2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test

  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: 문서만 바뀐 PR인지 본다
        id: scope
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "${{ github.event.pull_request.base.sha }}...HEAD")
          if printf '%s\n' "$changed" | grep -qvE '^(docs/|\.claude/|[^/]+\.md$)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "문서만 바뀌었다. 번들을 건너뛴다."
          fi
      - uses: pnpm/action-setup@v6
        if: steps.scope.outputs.code == 'true'
        with:
          version: 8.15.2
      - uses: actions/setup-node@v5
        if: steps.scope.outputs.code == 'true'
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.scope.outputs.code == 'true'
      # 검증 넷이 다 초록인데 Metro가 못 묶는 일이 있었다. 네이티브 컴파일 앞 단계인
      # JavaScript 번들만 본다 — 컴파일은 EAS 설정과 같이 온다.
      - name: 번들이 만들어지는지 본다
        if: steps.scope.outputs.code == 'true'
        run: pnpm bundle

  db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # DB를 띄우고 integration을 돌리는 데 CI 시간의 삼분의 이가 간다. 그래서 그 결과를
      # 바꿀 수 없는 파일만 바뀐 PR에서는 건너뛴다. 허용 목록으로 가르는 것은 목록 밖이
      # 늘 돌기 때문이다 — 새 폴더가 생겨도 안전한 쪽으로 틀린다. `ui`와 `hooks`와
      # `src/app/`은 `api/`가 당기지 않는 하류라 integration의 판정을 못 바꾼다.
      - name: integration이 볼 것이 바뀌었나
        id: scope
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "db=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "${{ github.event.pull_request.base.sha }}...HEAD")
          if printf '%s\n' "$changed" | grep -qvE '^(docs/|\.claude/|eslint-rules/|tests/lint/|tests/e2e/|src/app/|src/[^/]+/[^/]+/(ui|hooks)/|[^/]+\.md$)'; then
            echo "db=true" >> "$GITHUB_OUTPUT"
          else
            echo "db=false" >> "$GITHUB_OUTPUT"
            echo "integration의 판정을 바꿀 수 없는 파일만 바뀌었다. DB를 건너뛴다."
          fi
      - uses: pnpm/action-setup@v6
        if: steps.scope.outputs.db == 'true'
        with:
          version: 8.15.2
      - uses: actions/setup-node@v5
        if: steps.scope.outputs.db == 'true'
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.scope.outputs.db == 'true'
      - uses: supabase/setup-cli@v1
        if: steps.scope.outputs.db == 'true'
        with:
          version: 2.75.0
      # edge-runtime 컨테이너는 `supabase/functions` 한 폴더만 마운트한다. Edge Function이
      # 쓰는 `src/`의 순수 함수를 그 안으로 복사해두지 않으면 배포한 함수가 부팅에서 깨진다.
      - name: Edge Function이 쓰는 순수 함수를 마운트 안으로 복사한다
        if: steps.scope.outputs.db == 'true'
        run: pnpm edge:sync
      - name: 테스트가 쓰는 서비스만 띄운다
        if: steps.scope.outputs.db == 'true'
        # storage-api 가 목록에서 빠진 것은 avatars 버킷 테스트가 그 서비스에 붙기 때문이다.
        run: supabase start -x realtime,imgproxy,mailpit,postgres-meta,studio,edge-runtime
      - run: pnpm test:integration:run
        if: steps.scope.outputs.db == 'true'
      # 마이그레이션은 위 단계가 올렸다. 그 뒤의 DB에서 다시 뽑아 커밋된 것과 같은지 본다 —
      # 표를 바꾸고 `pnpm types`를 안 돌린 PR이 여기서 걸린다.
      - name: 생성 타입이 마이그레이션과 같은지 본다
        if: steps.scope.outputs.db == 'true'
        run: |
          pnpm types
          git diff --exit-code -- src/shared/api/databaseTypes.ts

  # 로컬 pre-commit 훅은 opt-in이라 우회 가능하다. CI에서 결정적으로 한 번 더 막는다.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  # 브랜치 보호가 요구하는 이름은 `ci` 하나다. 위를 병렬로 쪼개면서 이 자리가 그 이름을
  # 들고 셋의 결과를 모은다. `skipped`를 통과로 세는 것은 위 두 job이 스스로 건너뛸 수
  # 있기 때문이고, `always()`가 없으면 건너뛴 job 하나가 이 job까지 건너뛰게 만든다.
  ci:
    needs: [checks, bundle, db, secrets]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 쪼갠 job의 결과를 모은다
        run: |
          failed=0
          for pair in \
            "checks:${{ needs.checks.result }}" \
            "bundle:${{ needs.bundle.result }}" \
            "db:${{ needs.db.result }}" \
            "secrets:${{ needs.secrets.result }}"; do
            name=${pair%%:*}
            result=${pair#*:}
            case "$result" in
              success|skipped) echo "$name $result" ;;
              *) echo "$name $result"; failed=1 ;;
            esac
          done
          exit "$failed"
