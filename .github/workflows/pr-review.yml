name: pr-review

on:
  pull_request:
    # converted_to_draft는 리뷰를 새로 돌리지 않고, concurrency로 실행 중인 리뷰를 취소하는 용도
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]

concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # PUBLIC 저장소 가드 — fork PR과 draft는 리뷰하지 않는다
    if: github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # 정책은 PR이 못 건드리게 base 브랜치 사본을 쓴다.
      # base에 REVIEW.md가 아직 없으면(정책 도입 PR) PR 사본으로 대체한다.
      - name: 리뷰 정책을 base 브랜치에서 가져온다
        run: |
          git fetch --depth 1 origin "$GITHUB_BASE_REF"
          git show "origin/$GITHUB_BASE_REF:REVIEW.md" > /tmp/review-policy.md \
            || cp REVIEW.md /tmp/review-policy.md

      # 리포트가 붙었는지를 잡 자신이 본다 — 리뷰가 코멘트 없이 초록으로 끝난 것이 세 번이다
      # (관찰 019). 시작 시각을 적어두고 마지막 단계에서 그 뒤에 붙은 리뷰 코멘트를 센다.
      # 그 뒤 가드가 두 번 잡았고 원인은 막힌 도구였다 — 위 목록과 프롬프트가 관찰 022의 고침이다.
      - name: 시작 시각을 적는다
        id: started
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: anthropics/claude-code-action@v1
        id: review
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            /tmp/review-policy.md가 리뷰 정책 정본(REVIEW.md의 base 브랜치 사본)이다.
            먼저 읽고 그 검사 축과 리포트 형식대로 이 PR을 감사해라. 정책에 없는
            취향 지적은 하지 않는다.

            리포트는 `gh pr comment`로 PR에 코멘트 하나로 남긴다. 특정 줄에 붙는
            위험은 `mcp__github_inline_comment__create_inline_comment`(confirmed: true)로
            해당 줄에 단다. 코멘트는 한국어로 쓴다.

            **리포트를 `/tmp/review.md`에 쓰고 `gh pr comment ... --body-file /tmp/review.md`로
            넘긴다.** 셸 인자에 긴 한국어를 직접 실으면 따옴표에서 깨진다.

            도구가 막히거나 다 못 본 자리가 있으면 그 사실을 리포트의 「못 본 곳」에
            적어라. 어떤 경우에도 코멘트 하나는 남긴다 — 빈손으로 끝내면 안 본 것과
            구별이 안 된다(관찰 022). 한 길이 막히면 다른 길로 남겨라: 파일로 못 쓰면
            `--body`에 짧게라도 적고, 그것도 막히면 무엇이 막혔는지만이라도 코멘트로
            남긴다(관찰 026).
          claude_args: |
            --allowedTools "Read,Write,Grep,Glob,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(ls:*),Bash(wc:*),Bash(head:*),Bash(tail:*),Bash(sed:*),Bash(sort:*),Bash(uniq:*),mcp__github_inline_comment__create_inline_comment"

      # 워크플로 파일 자체를 고친 PR에서는 액션이 「기본 브랜치와 다르다」며 스스로 건너뛴다
      # (execution_file이 빈다). 그때는 셀 것이 없으니 이 단계도 건너뛴다 — #430에서 봤다.
      - name: 리포트 코멘트가 붙었는지 확인한다
        if: steps.review.outputs.execution_file != ''
        env:
          GH_TOKEN: ${{ github.token }}
          STARTED_AT: ${{ steps.started.outputs.at }}
        run: |
          count=$(gh pr view "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" --json comments \
            --jq "[.comments[] | select(.createdAt >= \"$STARTED_AT\") | select(.author.login | test(\"claude\"; \"i\"))] | length")
          if [ "$count" -eq 0 ]; then
            echo "::error::리뷰가 끝났지만 PR에 리포트 코멘트가 없다. 잡을 초록으로 두면 안 본 것과 구별이 안 된다 — 위 claude-code-action 로그의 result 블록을 본다."
            exit 1
          fi
          echo "리포트 코멘트 $count개 확인"
